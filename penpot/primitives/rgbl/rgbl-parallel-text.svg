<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">RGBL parallel text lanes</title>
  <desc id="desc">Three parallel content lanes showing source and translation records with separate language, script and provenance metadata.</desc>
  <rect width="960" height="420" fill="#0B0B0B"/>
  <text x="48" y="52" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="14" font-weight="700" letter-spacing="2">RGBL / PARALLEL CONTENT</text>
  <g transform="translate(48 92)">
    <rect width="864" height="88" rx="8" fill="#151515" stroke="#17A673"/>
    <text x="20" y="26" fill="#17A673" font-family="IBM Plex Mono,monospace" font-size="11">SOURCE · grc · Grek</text>
    <path d="M20 52H620" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round"/><path d="M20 67H520" stroke="#666" stroke-width="4" stroke-linecap="round"/>
    <text x="844" y="26" text-anchor="end" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10">artifact + provenance</text>
  </g>
  <g transform="translate(48 196)">
    <rect width="864" height="88" rx="8" fill="#151515" stroke="#3B82F6"/>
    <text x="20" y="26" fill="#3B82F6" font-family="IBM Plex Mono,monospace" font-size="11">TRANSLATION · en · Latn</text>
    <path d="M20 52H706" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round"/><path d="M20 67H566" stroke="#666" stroke-width="4" stroke-linecap="round"/>
    <text x="844" y="26" text-anchor="end" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10">distinct content id</text>
  </g>
  <g transform="translate(48 300)">
    <rect width="864" height="72" rx="8" fill="#151515" stroke="#4A4A4A" stroke-dasharray="6 5"/>
    <text x="20" y="26" fill="#D89B17" font-family="IBM Plex Mono,monospace" font-size="11">MISSING LANE</text>
    <text x="20" y="50" fill="#A3A3A3" font-family="Inter,Arial" font-size="13">Unavailable is rendered explicitly; missing text is never synthesized.</text>
  </g>
</svg>