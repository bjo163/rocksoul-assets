<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">RGBL textual relation map</title>
  <desc id="desc">A relation map showing explicit alignment, variant, translation and evidence edges without implying identity or equivalence.</desc>
  <rect width="960" height="420" fill="#0B0B0B"/>
  <text x="48" y="52" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="14" font-weight="700" letter-spacing="2">RGBL / TEXTUAL RELATIONS</text>
  <g stroke="#4A4A4A" stroke-width="2" fill="none"><path d="M250 210H420"/><path d="M540 210H710"/><path d="M480 150V92"/><path d="M480 268V326"/></g>
  <g font-family="IBM Plex Mono,monospace">
    <g transform="translate(80 166)"><rect width="170" height="88" rx="8" fill="#151515" stroke="#17A673"/><text x="14" y="26" fill="#17A673" font-size="10">PASSAGE A</text><text x="14" y="52" fill="#F7F4EC" font-size="12">source witness</text><text x="14" y="70" fill="#666" font-size="9">canonical id</text></g>
    <g transform="translate(420 166)"><rect width="120" height="88" rx="44" fill="#151515" stroke="#D1132A"/><text x="60" y="34" text-anchor="middle" fill="#D1132A" font-size="10">RELATION</text><text x="60" y="57" text-anchor="middle" fill="#F7F4EC" font-size="11">explicit</text></g>
    <g transform="translate(710 166)"><rect width="170" height="88" rx="8" fill="#151515" stroke="#3B82F6"/><text x="14" y="26" fill="#3B82F6" font-size="10">PASSAGE B</text><text x="14" y="52" fill="#F7F4EC" font-size="12">parallel witness</text><text x="14" y="70" fill="#666" font-size="9">canonical id</text></g>
    <g transform="translate(390 44)"><rect width="180" height="48" rx="8" fill="#151515" stroke="#4A4A4A" stroke-dasharray="5 4"/><text x="90" y="29" text-anchor="middle" fill="#D89B17" font-size="10">VARIANT / ALIGNMENT</text></g>
    <g transform="translate(390 326)"><rect width="180" height="48" rx="8" fill="#151515" stroke="#4A4A4A"/><text x="90" y="29" text-anchor="middle" fill="#A3A3A3" font-size="10">EVIDENCE + METHOD</text></g>
  </g>
  <text x="48" y="394" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10">SIMILARITY ≠ EQUIVALENCE · ALIGNMENT ≠ IDENTITY · RELATION TYPE MUST BE EXPLICIT</text>
</svg>