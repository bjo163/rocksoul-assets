<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">RGBL canonical textual hierarchy</title>
  <desc id="desc">A six-stage semantic diagram from work to expression, edition, artifact, passage and content.</desc>
  <rect width="960" height="360" fill="#0B0B0B"/>
  <text x="48" y="52" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="14" font-weight="700" letter-spacing="2">RGBL / CANONICAL TEXT TRACE</text>
  <text x="48" y="88" fill="#F7F4EC" font-family="Inter Tight,Arial" font-size="30" font-weight="800">Preserve identity at every textual layer.</text>
  <g font-family="IBM Plex Mono,monospace" font-size="11">
    <g transform="translate(48 142)"><rect width="124" height="110" rx="8" fill="#151515" stroke="#D1132A" stroke-width="2"/><text x="14" y="28" fill="#D1132A">01 / WORK</text><text x="14" y="58" fill="#F7F4EC">canonical</text><text x="14" y="77" fill="#A3A3A3">abstract work</text></g>
    <g transform="translate(196 142)"><rect width="124" height="110" rx="8" fill="#151515" stroke="#4A4A4A"/><text x="14" y="28" fill="#A3A3A3">02 / EXPRESSION</text><text x="14" y="58" fill="#F7F4EC">language</text><text x="14" y="77" fill="#A3A3A3">representation</text></g>
    <g transform="translate(344 142)"><rect width="124" height="110" rx="8" fill="#151515" stroke="#4A4A4A"/><text x="14" y="28" fill="#A3A3A3">03 / EDITION</text><text x="14" y="58" fill="#F7F4EC">version</text><text x="14" y="77" fill="#A3A3A3">editorial state</text></g>
    <g transform="translate(492 142)"><rect width="124" height="110" rx="8" fill="#151515" stroke="#4A4A4A"/><text x="14" y="28" fill="#A3A3A3">04 / ARTIFACT</text><text x="14" y="58" fill="#F7F4EC">source file</text><text x="14" y="77" fill="#A3A3A3">revision · sha</text></g>
    <g transform="translate(640 142)"><rect width="124" height="110" rx="8" fill="#151515" stroke="#4A4A4A"/><text x="14" y="28" fill="#A3A3A3">05 / PASSAGE</text><text x="14" y="58" fill="#F7F4EC">locator</text><text x="14" y="77" fill="#A3A3A3">canonical unit</text></g>
    <g transform="translate(788 142)"><rect width="124" height="110" rx="8" fill="#151515" stroke="#17A673"/><text x="14" y="28" fill="#17A673">06 / CONTENT</text><text x="14" y="58" fill="#F7F4EC">exact text</text><text x="14" y="77" fill="#A3A3A3">source/translation</text></g>
    <g stroke="#666" stroke-width="1.5" fill="none"><path d="M172 197H196"/><path d="M320 197H344"/><path d="M468 197H492"/><path d="M616 197H640"/><path d="M764 197H788"/></g>
  </g>
  <text x="48" y="312" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="11">TRANSLATION ≠ SOURCE IDENTITY · CORPUS PRESENCE ≠ UNIVERSAL AUTHORITY</text>
</svg>