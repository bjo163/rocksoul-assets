<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">RGBL provenance trace</title>
  <desc id="desc">A source trace showing upstream source, acquisition artifact, canonical content, evidence reference and reproducible review metadata.</desc>
  <rect width="960" height="400" fill="#0B0B0B"/>
  <text x="48" y="52" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="14" font-weight="700" letter-spacing="2">RGBL / PROVENANCE</text>
  <path d="M94 198H866" stroke="#4A4A4A" stroke-width="2"/>
  <g font-family="IBM Plex Mono,monospace">
    <g transform="translate(48 126)"><circle cx="46" cy="72" r="12" fill="#D1132A"/><text x="0" y="20" fill="#A3A3A3" font-size="10">UPSTREAM</text><text x="0" y="42" fill="#F7F4EC" font-size="12">source</text><text x="0" y="112" fill="#666" font-size="9">URL · revision</text></g>
    <g transform="translate(246 126)"><circle cx="46" cy="72" r="12" fill="#F4C542"/><text x="0" y="20" fill="#A3A3A3" font-size="10">ARTIFACT</text><text x="0" y="42" fill="#F7F4EC" font-size="12">pinned file</text><text x="0" y="112" fill="#666" font-size="9">SHA-256 · rights</text></g>
    <g transform="translate(444 126)"><circle cx="46" cy="72" r="12" fill="#17A673"/><text x="0" y="20" fill="#A3A3A3" font-size="10">CONTENT</text><text x="0" y="42" fill="#F7F4EC" font-size="12">exact text</text><text x="0" y="112" fill="#666" font-size="9">canonical id</text></g>
    <g transform="translate(642 126)"><circle cx="46" cy="72" r="12" fill="#3B82F6"/><text x="0" y="20" fill="#A3A3A3" font-size="10">EVIDENCE</text><text x="0" y="42" fill="#F7F4EC" font-size="12">explicit ref</text><text x="0" y="112" fill="#666" font-size="9">selector · relation</text></g>
    <g transform="translate(816 126)"><circle cx="46" cy="72" r="12" fill="#F7F4EC"/><text x="0" y="20" fill="#A3A3A3" font-size="10">REVIEW</text><text x="0" y="42" fill="#F7F4EC" font-size="12">trace</text><text x="-4" y="112" fill="#666" font-size="9">method · state</text></g>
  </g>
  <text x="48" y="344" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="11">PROVENANCE IS REQUIRED · ASSERTION ≠ GLOBAL FACT</text>
</svg>