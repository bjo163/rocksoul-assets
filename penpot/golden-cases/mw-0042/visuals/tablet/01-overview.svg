if" font-size="62" font-weight="800" text-anchor="start">0.87</text><text x="172" y="609.4" fill="#16A36A" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start">MEDIUM-HIGH</text><text x="172" y="635.4" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">Temporal 0.94  ·  Motif 0.89  ·  Source independence 0.91</text><text x="172" y="661.4" fill="#D89B17" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">Identity 0.64 — still blocking closure.</text><line x1="32" y1="731.4" x2="736" y2="731.4" stroke="#D1132A" stroke-width="2"/><text x="32" y="755.4" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700" text-anchor="start">THE BOUNDARY / AWS</text><text x="32" y="785.4" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">Evidence asks what happened. Law asks what rule would apply.</text>
