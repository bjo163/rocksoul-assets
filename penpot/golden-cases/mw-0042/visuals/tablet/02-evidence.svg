  <text x="32" y="38" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start">MOONWITNESS</text><text x="32" y="58" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="600" text-anchor="start">INDEPENDENT OBSERVATORY</text><text x="736" y="38" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="600" text-anchor="end">CASE / MW-0042</text><line x1="32" y1="76" x2="736" y2="76" stroke="#2E2E2E" stroke-width="1"/><text x="32" y="112" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700" text-anchor="start">MW-0042 / EVIDENCE</text><text x="32" y="154" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="800" text-anchor="start">FOUR RECORDS.</text><text x="32" y="186" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Separate first. Correlate later.</text><rect x="32" y="220" width="342" height="220" rx="0" fill="#151515" stroke="#2E2E2E" stroke-width="1"/><text x="50" y="244" fill="#E51735" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700" text-anchor="start">STORY</text><rect x="264" y="232" width="87" height="28" rx="14" fill="#1B1B1B" stroke="#16A36A" stroke-width="1"/><text x="276" y="251" fill="#16A36A" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" text-anchor="start">SUPPORTED</text><text x="50" y="276" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">A route nobody remembers taking</text><text x="50" y="304" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">A recurring account describes a silent departure, a missing inte</text><text x="50" y="323" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">rval, and a return before sunrise.</text><text x="50" y="422" fill="#666666" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="600" text-anchor="start">SOURCE LINKED</text><rect x="394" y="220" width="342" height="220" rx="0" fill="#151515" stroke="#2E2E2E" stroke-width="1"/><text x="412" y="244" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700" text-anchor="start">EVENT</text><rect x="626" y="232" width="87" height="28" rx="14" fill="#1B1B1B" stroke="#16A36A" stroke-width="1"/><text x="638" y="251" fill="#16A36A" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" text-anchor="start">SUPPORTED</text><text x="412" y="276" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">Movement recorded inside the missing interval</text><text x="412" y="304" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">A timestamped event record places an unidentified movement insid</text><text x="412" y="323" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">e the same time window.</text><text x="412" y="422" fill="#666666" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="600" text-anchor="start">SOURCE LINKED</text><rect x="32" y="460" width="342" height="220" rx="0" fill="#151515" stroke="#2E2E2E" stroke-width="1"/><text x="50" y="484" fill="#D89B17" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700" text-anchor="start">PERSON</text><rect x="264" y="472" width="73" height="28" rx="14" fill="#1B1B1B" stroke="#D89B17" stroke-width="1"/><text x="276" y="491" fill="#D89B17" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" text-anchor="start">PARTIAL</text><text x="50" y="516" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">Identity match is incomplete</text><text x="50" y="544" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">Two attributes line up with the person record, but one key ident</text><text x="50" y="563" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">ity field remains unverified.</text><text x="50" y="662" fill="#666666" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="600" text-anchor="start">SOURCE LINKED</text><rect x="394" y="460" width="342" height="220" rx="0" fill="#151515" stroke="#2E2E2E" stroke-width="1"/><text x="412" y="484" fill="#3B82F6" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700" text-anchor="start">RGBL</text><rect x="626" y="472" width="87" height="28" rx="14" fill="#1B1B1B" stroke="#16A36A" stroke-width="1"/><text x="638" y="491" fill="#16A36A" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" text-anchor="start">SUPPORTED</text><text x="412" y="516" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">The text preserves the same motif</text><text x="412" y="544" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">A source fragment contains a movement / silence / return motif. </text><text x="412" y="563" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">Causal relation is not established.</text><text x="412" y="662" fill="#666666" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="600" text-anchor="start">SOURCE LINKED</text><line x1="32" y1="718" x2="736" y2="718" stroke="#D1132A" stroke-width="2"/><text x="32" y="742" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700" text-anchor="start">AWS IS DOWNSTREAM — NOT RECORD 05</text>
