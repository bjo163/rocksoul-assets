xt x="36" y="534" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" text-anchor="start">What rule would apply?</text><text x="36" y="568" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">Jurisdiction: unresolved</text><rect x="36" y="588" width="80" height="28" rx="14" fill="#1B1B1B" stroke="#D1132A" stroke-width="1"/><text x="48" y="607" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" text-anchor="start">DISPUTED</text><rect x="18" y="656" width="354" height="210" rx="0" fill="#F7F4EC" stroke="none" stroke-width="1"/><text x="36" y="686" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700" text-anchor="start">FIXTURE INSTRUMENTS / REFERENCE ONLY</text><text x="36" y="726" fill="#0B0B0B" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start">01  Synthetic Cross-Border Movement Instrument</text><text x="36" y="760" fill="#0B0B0B" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start">02  Synthetic Protected-Passage Rule</text><line x1="36" y1="788" x2="354" y2="788" stroke="#D9D6CE" stroke-width="1"/><text x="36" y="820" fill="#4A4A4A" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start">Still open. The legal layer does not close the evidence layer.</text>
