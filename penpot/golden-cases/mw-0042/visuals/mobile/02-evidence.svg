  <text x="18" y="38" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start">MOONWITNESS</text><text x="18" y="58" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="600" text-anchor="start">INDEPENDENT OBSERVATORY</text><text x="372" y="38" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="600" text-anchor="end">CASE / MW-0042</text><line x1="18" y1="76" x2="372" y2="76" stroke="#2E2E2E" stroke-width="1"/><text x="18" y="112" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700" text-anchor="start">MW-0042 / EVIDENCE</text><text x="18" y="154" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" text-anchor="start">FOUR RECORDS.</text><text x="18" y="186" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Separate first. Correlate later.</text><rect x="18" y="220" width="354" height="126" rx="0" fill="#151515" stroke="#2E2E2E" stroke-width="1"/><text x="36" y="244" fill="#E51735" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700" text-anchor="start">STORY</text><rect x="262" y="232" width="87" height="28" rx="14" fill="#1B1B1B" stroke="#16A36A" stroke-width="1"/><text x="274" y="251" fill="#16A36A" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" text-anchor="start">SUPPORTED</text><text x="36" y="276" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">A route nobody remembers taking</text><text x="36" y="304" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">A recurring account describes a silent departure, a missing inte</text><text x="36" y="323" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">rval, and a return before sunrise.</text