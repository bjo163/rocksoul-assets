font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">Two attributes line up with the person record, but one key ident</text><text x="36" y="599" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">ity field remains unverified.</text><text x="36" y="604" fill="#666666" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="600" text-anchor="start">SOURCE LINKED</text><rect x="18" y="634" width="354" height="126" rx="0" fill="#151515" stroke="#2E2E2E" stroke-width="1"/><text x="36" y="658" fill="#3B82F6" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700" text-anchor="start">RGBL</text><rect x="262" y="646" width="87" height="28" rx="14" fill="#1B1B1B" stroke="#16A36A" stroke-width="1"/><text x="274" y="665" fill="#16A36A" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" text-anchor="start">SUPPORTED</text><text x="36" y="690" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">The text preserves the same motif</text><text x="36" y="718" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">A source fragment contains a movement / silence / return motif. </text><text x="36" y="737" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">Causal relation is not established.</text><text x="36" y="742" fill="#666666" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="600" text-anchor="start">SOURCE LINKED</text><text x="18" y="780" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700" text-anchor="start">AWS IS DOWNSTREAM — NOT RECORD 05</text>
