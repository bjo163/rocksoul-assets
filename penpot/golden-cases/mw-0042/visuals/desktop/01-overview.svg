  <text x="56" y="38" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start">MOONWITNESS</text><text x="56" y="58" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="600" text-anchor="start">INDEPENDENT OBSERVATORY</text><text x="1384" y="38" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="600" text-anchor="end">CASE / MW-0042</text><line x1="56" y1="76" x2="1384" y2="76" stroke="#2E2E2E" stroke-width="1"/><text x="56" y="111" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700" text-anchor="start">GOLDEN CASE / DESIGN FIXTURE</text><text x="56" y="145" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="84" font-weight="800" text-anchor="start">THE SILENT</text><text x="56" y="222.28" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="84" font-weight="800" text-anchor="start">FLIGHT</text><text x="56" y="258.4" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Four separate records appear to line up around one unexplained movement.</text><text x="56" y="282.4" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Enough to investigate. Not enough to close.</text><rect x="56" y="318.4" width="94" height="28" rx="14" fill="#1B1B1B" stroke="#A3A3A3" stroke-width="1"/><text x="68" y="337.4" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" text-anchor="start">UNRESOLVED</text><rect x="56" y="380.4" width="318.5" height="176" rx="0" fill="#151515" stroke="#2E2E2E" stroke-width="1"/><text x="74" y="404.4" fill="#E51735" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700" text-anchor="start">STORY</text><rect x="264.5" y="392.4" width="87" height="28" rx="14" fill="#1B1B1B" stroke="#16A36A" stroke-width="1"/><text x="276.5" y="411.4" fill="#16A36A" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" text-anchor="start">SUPPORTED</text><text x="74" y="436.4" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">A route nobody remembers taking</text><text x="74" y="464.4" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">A recurring account describes a silent departure and return.</text><text x="74" y="538.4" fill="#666666" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="600" text-anchor="start">SOURCE LINKED</text><rect x="392.5" y="380.4" width="318.5" height="176" rx="0" fill="#151515" stroke="#2E2E2E" stroke-width="1"/><text x="410.5" y="404.4" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700" text-anchor="start">EVENT</text><rect x="601" y="392.4" width="87" height="28" rx="14" fill="#1B1B1B" stroke="#16A36A" stroke-width="1"/><text x="613" y="411.4" fill="#16A36A" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" text-anchor="start">SUPPORTED</text><text x="410.5" y="436.4" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">Movement inside the missing interval</text><text x="410.5" y="464.4" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">A timestamped movement sits inside the same window.</text><text x="410.5" y="538.4" fill="#666666" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="600" text-anchor="start">SOURCE LINKED</text><rect x="729" y="380.4" width="318.5" height="176" rx="0" fill="#151515" stroke="#2E2E2E" stroke-width="1"/><text x="747" y="404.4" fill="#D89B17" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700" text-anchor="start">PERSON</text><rect x="937.5" y="392.4" width="73" height="28" rx="14" fill="#1B1B1B" stroke="#D89B17" stroke-width="1"/><text x="949.5" y="411.4" fill="#D89B17" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" text-anchor="start">PARTIAL</text><text x="747" y="436.4" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">Identity match is incomplete</text><text x="747" y="464.4" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">Two attributes line up. One key identity field does not.</text><text x="747" y="538.4" fill="#666666" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="600" text-anchor="start">SOURCE LINKED</text><rect x="1065.5" y="380.4" width="318.5" height="176" rx="0" fill="#151515" stroke="#2E2E2E" stroke-width="1"/><text x="1083.5" y="404.4" fill="#3B82F6" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700" text-anchor="start">RGBL</text><rect x="1274" y="392.4" width="87" height="28" rx="14" fill="#1B1B1B" stroke="#16A36A" stroke-width="1"/><text x="1286" y="411.4" fill="#16A36A" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" text-anchor="start">SUPPORTED</text><text x="1083.5" y="436.4" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">The text preserves the same motif</text><text x="1083.5" y="464.4" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">Movement, silence, and return appear in the source fragment.</text><text x="1083.5" y="538.4" fill="#666666" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="600" text-anchor="start">SOURCE LINKED</text><rect x="56" y="582.4" width="770" height="154" rx="0" fill="#1B1B1B" stroke="#2E2E2E" stroke-width="1"/><text x="76" y="610.4" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700" text-anchor="start">CORRELATION PREVIEW</text><text x="76" y="668.4" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="800" text-anchor="start">0.87</text><text x="196" y="636.4" fill="#16A36A" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start">MEDIUM-HIGH</text><text x="196" y="662.4" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">Temporal 0.94  ·  Motif 0.89  ·  Source independence 0.91</text><text x="196" y="688.4" fill="#D89B17" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">Identity 0.64 — still blocking closure.</text><rect x="844" y="582.4" width="540" height="154" rx="0" fill="#151515" stroke="#D1132A" stroke-width="1"/><text x="864" y="610.4" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700" text-anchor="start">AWS / LEGAL</text><text x="864" y="642.4" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="start">THE BOUNDARY</text><text x="864" y="672.4" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">Disputed · jurisdiction unresolved</text><text x="864" y="700.4" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start">Cool. Now the law gets involved.</text>
