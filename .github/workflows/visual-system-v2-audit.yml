name: Visual System V2 Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "moonwitness/**"
      - "penpot/tokens/**"
      - "tools/assets/generate-visual-system-v2-audit.mjs"
      - "tools/assets/validate-visual-system.mjs"
      - "docs/ART-DIRECTION-V2.md"
      - "docs/GRAPH-GRAMMAR-V2.md"
      - "docs/DATA-VIZ-GRAMMAR-V2.md"
      - ".github/workflows/visual-system-v2-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Generate quantitative visual baseline
        run: node tools/assets/generate-visual-system-v2-audit.mjs --write
      - name: Validate Visual System V2 foundation
        run: node tools/assets/validate-visual-system.mjs
      - name: Materialize generated evidence on internal PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/VISUAL-AUDIT-V2.md docs/generated/visual-system-audit.json docs/generated/visual-system-v2
          if git diff --cached --quiet; then
            echo "Visual audit evidence already current."
          else
            git commit -m "docs(visual-v2): materialize quantitative audit evidence"
            git push origin "HEAD:${HEAD_REF}"
          fi
      - name: Print audit summary
        run: |
          cat docs/generated/visual-system-audit.json
          printf '\n--- VISUAL AUDIT MARKDOWN ---\n'
          cat docs/VISUAL-AUDIT-V2.md
      - name: Upload visual audit evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: visual-system-v2-audit
          path: |
            docs/VISUAL-AUDIT-V2.md
            docs/generated/visual-system-audit.json
            docs/generated/visual-system-v2/
