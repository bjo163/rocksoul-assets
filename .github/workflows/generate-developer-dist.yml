name: Generate Developer Distribution

on:
  workflow_dispatch:
  push:
    branches: [main, feat/showcase-full-coverage]
    paths:
      - "moonwitness/**"
      - "tools/assets/build-dist.mjs"
      - "showcase/catalog.json"
      - ".github/workflows/generate-developer-dist.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'moonwitness-dist-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build distribution registry
        run: node tools/assets/build-dist.mjs
      - name: Commit generated dist
        run: |
          git config user.name "moonwitness-dist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "No dist changes."
          else
            git commit -m "build(dist): generate developer asset registry"
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push; then
                break
              fi
              test "$attempt" -lt 3
              sleep 2
            done
          fi
