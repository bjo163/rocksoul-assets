name: Generate Developer Distribution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "moonwitness/**"
      - "tools/assets/build-dist.mjs"
      - "tools/assets/validate-classification.mjs"
      - "showcase/catalog.json"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'moonwitness-dist-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Build distribution registry
        run: node tools/assets/build-dist.mjs
      - name: Commit generated dist
        run: |
          git config user.name "moonwitness-dist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "No dist changes."
          else
            git commit -m "build(dist): generate developer asset registry"
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push; then break; fi
              test "$attempt" -lt 3
              sleep 2
            done
          fi
