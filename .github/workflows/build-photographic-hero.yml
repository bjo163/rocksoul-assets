name: Build Photographic Hero Masters

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "source-inputs/hero/**"
      - "tools/assets/build-photographic-hero.sh"
      - ".github/workflows/build-photographic-hero.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp

      - name: Build masters
        run: bash tools/assets/build-photographic-hero.sh

      - name: Commit generated masters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moonwitness/cinematic-hero-pack/webp
          if git diff --cached --quiet; then
            echo "Photographic hero masters are already current."
            exit 0
          fi
          git commit -m "assets: build photographic hero masters [skip ci]"
          git push origin HEAD:main
