name: Generate PERSPECTIVE Derivatives

on:
  push:
    branches:
      - ecosystem/perspective-first-class

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ecosystem/perspective-first-class
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check cairosvg==2.7.1 pillow==10.4.0
      - run: python tools/assets/render-packs.py
      - name: Commit generated derivatives
        run: |
          if git diff --quiet -- moonwitness; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "moonwitness-design-bot"
          git config user.email "actions@users.noreply.github.com"
          git add moonwitness
          git commit -m "build: generate PERSPECTIVE raster derivatives"
          git push origin HEAD:ecosystem/perspective-first-class
