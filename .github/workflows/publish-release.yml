name: Publish Release

on:
  workflow_run:
    workflows: ["Release Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release commit
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify release metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const expected = process.env.VERSION;
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (manifest.release?.version !== expected) throw new Error('manifest release version mismatch');
          if (manifest.release?.status !== 'released') throw new Error('release is not marked released');
          NODE

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ steps.release.outputs.sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; leaving existing release unchanged."
          else
            gh release create "$TAG"               --target "$TARGET_SHA"               --title "MoonWitness Asset System v$VERSION"               --notes-file RELEASE.md               --latest
          fi
