name: Generate Brand Raster Assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/final-asset-closure-v1.3.1
    paths:
      - "moonwitness/brand/*.svg"
      - "tools/assets/render-brand.py"
      - ".github/workflows/generate-brand-raster.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check cairosvg==2.7.1 pillow==10.4.0

      - name: Render canonical SVG sources
        run: python tools/assets/render-brand.py

      - name: Commit generated raster delivery assets
        run: |
          git config user.name "moonwitness-assets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add moonwitness/brand/generated
          if git diff --cached --quiet; then
            echo "No generated raster changes."
          else
            git commit -m "build(brand): generate raster delivery assets"
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push; then
                break
              fi
              test "$attempt" -lt 3
              sleep 2
            done
          fi
