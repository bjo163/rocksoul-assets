name: Visual System V2 Migration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "moonwitness/**"
      - "penpot/**"
      - "showcase/**"
      - "docs/**"
      - "dist/**"
      - "tools/assets/**"
      - ".github/workflows/visual-system-v2-migration.yml"
      - ".github/workflows/visual-system-v2-audit.yml"

permissions:
  contents: write

concurrency:
  group: visual-system-v2-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install deterministic raster renderer
        run: python -m pip install --disable-pip-version-check cairosvg==2.7.1

      - name: Materialize Visual System V2 canonical sources
        run: python tools/assets/generate_visual_system_v2_migration.py

      - name: Render all canonical PNG derivatives
        run: python tools/assets/render-packs.py

      - name: Rebuild developer asset registry
        run: node tools/assets/build-dist.mjs

      - name: Regenerate quantitative visual audit
        run: node tools/assets/generate-visual-system-v2-audit.mjs --write

      - name: Validate SVG XML
        run: python tools/assets/validate-svg-xml.py

      - name: Validate asset pairing and contracts
        run: node tools/assets/validate.mjs

      - name: Validate registry integrity
        run: node tools/assets/validate-registry-integrity.mjs

      - name: Validate asset classification
        run: node tools/assets/validate-classification.mjs

      - name: Validate production primitives
        run: node tools/assets/validate-primitives.mjs

      - name: Validate Visual System V2 strict contract
        run: node tools/assets/validate-visual-system.mjs

      - name: Validate Asset Explorer contract
        run: node tools/assets/validate-explorer-contract.mjs

      - name: Validate migration idempotence
        run: python tools/assets/generate_visual_system_v2_migration.py --check

      - name: Validate audit idempotence
        run: node tools/assets/generate-visual-system-v2-audit.mjs --check

      - name: Materialize migration on internal PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Visual System V2 migration already materialized."
            exit 0
          fi
          git commit -m "build(visual-v2): materialize canonical migration"
          for attempt in 1 2 3; do
            git pull --rebase origin "$HEAD_REF"
            if git push origin "HEAD:$HEAD_REF"; then
              exit 0
            fi
            test "$attempt" -lt 3
            sleep 2
          done

      - name: Upload migration evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: visual-system-v2-migration
          path: |
            docs/VISUAL-AUDIT-V2.md
            docs/VISUAL-SYSTEM-V2-MIGRATION.md
            docs/generated/visual-system-v2/
            dist/assets.json
            showcase/v2/
