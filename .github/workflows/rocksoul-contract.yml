name: ROCKSOUL Repository Contract

on:
  workflow_dispatch:
  push:
    paths:
      - "ROCKSOUL-REPO.json"
      - "ROCKSOUL-TODO.json"
      - "scripts/validate-rocksoul-contract.mjs"
      - "tools/todo/**"
      - ".github/workflows/rocksoul-contract.yml"
  pull_request:
    paths:
      - "ROCKSOUL-REPO.json"
      - "ROCKSOUL-TODO.json"
      - "scripts/validate-rocksoul-contract.mjs"
      - "tools/todo/**"
      - ".github/workflows/rocksoul-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Validate repository contract
        run: |
          node scripts/validate-rocksoul-contract.mjs
          node tools/todo/validate-evidence.mjs
