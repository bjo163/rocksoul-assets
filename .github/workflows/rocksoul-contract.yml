name: ROCKSOUL Repository Contract

on:
  workflow_dispatch:
  push:
    paths:
      - "ROCKSOUL-REPO.json"
      - "ROCKSOUL-TODO.json"
      - "scripts/validate-rocksoul-contract.mjs"
      - ".github/workflows/rocksoul-contract.yml"
  pull_request:
    paths:
      - "ROCKSOUL-REPO.json"
      - "ROCKSOUL-TODO.json"
      - "scripts/validate-rocksoul-contract.mjs"
      - ".github/workflows/rocksoul-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate repository contract
        run: node scripts/validate-rocksoul-contract.mjs
