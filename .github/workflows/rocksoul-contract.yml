name: ROCKSOUL Repository Contract

on:
  workflow_dispatch:
  push:
    paths:
      - "ROCKSOUL-REPO.json"
      - "ROCKSOUL-TODO.json"
      - "scripts/validate-rocksoul-contract.mjs"
      - ".github/workflows/rocksoul-contract.yml"
  pull_request:
    paths:
      - "ROCKSOUL-REPO.json"
      - "ROCKSOUL-TODO.json"
      - "scripts/validate-rocksoul-contract.mjs"
      - ".github/workflows/rocksoul-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate repository contract
        run: node scripts/validate-rocksoul-contract.mjs
