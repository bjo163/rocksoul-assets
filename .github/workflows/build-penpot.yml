name: Build Penpot Golden Slice

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "manifest.json"
      - "tools/penpot/**"
      - "penpot/tokens/**"
      - "penpot/primitives/**"
      - "penpot/components/**"
      - "penpot/patterns/**"
      - "penpot/screens/**"
      - "penpot/responsive/**"
      - "penpot/golden-cases/mw-0042/**"
      - ".github/workflows/build-penpot.yml"
  push:
    branches: [main]
    paths:
      - "manifest.json"
      - "tools/penpot/**"
      - "penpot/tokens/**"
      - "penpot/primitives/**"
      - "penpot/components/**"
      - "penpot/patterns/**"
      - "penpot/screens/**"
      - "penpot/responsive/**"
      - "penpot/golden-cases/mw-0042/**"
      - ".github/workflows/build-penpot.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install builder
        working-directory: tools/penpot
        run: npm ci --no-audit --no-fund

      - name: Validate design sources
        working-directory: tools/penpot
        run: npm run validate:sources

      - name: Generate Penpot file
        working-directory: tools/penpot
        run: npm run generate

      - name: Validate package structure
        working-directory: tools/penpot
        run: npm run validate

      - name: Upload Penpot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moonwitness-mw-0042-penpot
          path: penpot/generated/moonwitness-mw-0042.penpot

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download generated Penpot artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: moonwitness-mw-0042-penpot
          path: penpot/generated

      - name: Commit generated Penpot file
        run: |
          git config user.name "moonwitness-design-bot"
          git config user.email "actions@users.noreply.github.com"
          git add penpot/generated/moonwitness-mw-0042.penpot
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "build: generate MW-0042 Penpot file"
            git push
          fi
