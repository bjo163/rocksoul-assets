name: Build Penpot Golden Slice

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "manifest.json"
      - "tools/penpot/**"
      - "penpot/tokens/**"
      - "penpot/primitives/**"
      - "penpot/components/**"
      - "penpot/patterns/**"
      - "penpot/screens/**"
      - "penpot/responsive/**"
      - "penpot/golden-cases/mw-0042/**"
      - ".github/workflows/build-penpot.yml"
  push:
    branches: [main]
    paths:
      - "manifest.json"
      - "tools/penpot/**"
      - "penpot/tokens/**"
      - "penpot/primitives/**"
      - "penpot/components/**"
      - "penpot/patterns/**"
      - "penpot/screens/**"
      - "penpot/responsive/**"
      - "penpot/golden-cases/mw-0042/**"
      - ".github/workflows/build-penpot.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Install builder
        working-directory: tools/penpot
        run: npm ci --no-audit --no-fund
      - name: Validate design sources
        working-directory: tools/penpot
        run: npm run validate:sources
      - name: Generate Penpot file
        working-directory: tools/penpot
        run: npm run generate
      - name: Validate package structure
        working-directory: tools/penpot
        run: npm run validate
      - name: Upload Penpot artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: moonwitness-mw-0042-penpot
          path: penpot/generated/moonwitness-mw-0042.penpot

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Download generated Penpot artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: moonwitness-mw-0042-penpot
          path: penpot/generated
      - name: Commit generated Penpot file
        run: |
          git config user.name "moonwitness-design-bot"
          git config user.email "actions@users.noreply.github.com"
          git add penpot/generated/moonwitness-mw-0042.penpot
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "build: generate MW-0042 Penpot file"
            git push
          fi
