name: Branch Hygiene

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview deletions without changing refs"
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/branch-hygiene.yml"
  schedule:
    - cron: "19 3 * * 0"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: rocksoul-branch-hygiene
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Delete merged and explicitly retired branches
        shell: bash
        run: |
          set -euo pipefail

          retired=(
            "dev"
            "ecosystem/perspective-first-class"
            "feat/perspective-first-class-visual"
            "fix/main-only-generator-policy"
          )

          is_retired() {
            local candidate="$1"
            local item
            for item in "${retired[@]}"; do
              [ "$item" = "$candidate" ] && return 0
            done
            return 1
          }

          mapfile -t open_heads < <(
            gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
              --json headRefName --jq '.[].headRefName'
          )

          is_open_head() {
            local candidate="$1"
            local head
            for head in "${open_heads[@]}"; do
              [ "$head" = "$candidate" ] && return 0
            done
            return 1
          }

          mapfile -t branches < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name'
          )

          for branch in "${branches[@]}"; do
            case "$branch" in
              main|archive/*|feat/mftl-observatory-assets|feat/mftl-observatory-assets-v2)
                echo "KEEP ${branch}: protected"
                continue
                ;;
            esac

            if is_open_head "$branch"; then
              echo "KEEP ${branch}: open PR"
              continue
            fi

            delete_reason=""
            if is_retired "$branch"; then
              delete_reason="explicitly retired"
            else
              merged_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged \
                --head "$branch" --limit 1 --json number --jq 'length')"
              if [ "$merged_count" != "0" ]; then
                delete_reason="merged PR provenance"
              fi
            fi

            if [ -z "$delete_reason" ]; then
              echo "KEEP ${branch}: no safe deletion evidence"
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY-RUN DELETE ${branch}: ${delete_reason}"
              continue
            fi

            echo "DELETE ${branch}: ${delete_reason}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
