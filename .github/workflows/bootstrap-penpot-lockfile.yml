name: Bootstrap Penpot Lockfile

on:
  push:
    branches:
      - feat/complete-asset-system
    paths:
      - "tools/penpot/package.json"
      - ".github/workflows/bootstrap-penpot-lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate package-lock
        working-directory: tools/penpot
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile
        run: |
          git config user.name "moonwitness-assets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/penpot/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "build: lock Penpot builder dependencies"
            git push
          fi
