name: Materialize LEGEND Asset Derivatives

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/materialize-legend-assets-dev.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --disable-pip-version-check cairosvg==2.7.1
      - name: Render deterministic PNG derivatives
        run: python tools/assets/render-packs.py
      - name: Rebuild developer registry
        run: node tools/assets/build-dist.mjs
      - name: Commit generated delivery
        run: |
          git config user.name "moonwitness-assets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add moonwitness/data-viz/png dist
          if git diff --cached --quiet; then
            echo "Generated delivery already current."
          else
            git commit -m "build(assets): materialize LEGEND visual delivery"
            git push origin HEAD:dev
          fi
