name: Refresh Asset Distribution Registry

on:
  push:
    branches:
      - ecosystem/perspective-first-class

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ecosystem/perspective-first-class
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/assets/build-dist.mjs
      - name: Commit generated registry
        run: |
          if git diff --quiet -- dist; then
            echo "No distribution changes"
            exit 0
          fi
          git config user.name "moonwitness-design-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist
          git commit -m "build: refresh PERSPECTIVE asset distribution"
          git push origin HEAD:ecosystem/perspective-first-class
