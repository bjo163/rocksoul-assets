name: Release Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "VERSION"
      - "CHANGELOG.md"
      - "RELEASE.md"
      - "README.md"
      - "manifest.json"
      - "docs/RELEASE-CHECKLIST.md"
      - "docs/PENPOT-LIVE-VERIFICATION.md"
      - "docs/DESIGN-SYSTEM-READINESS.md"
      - ".github/workflows/release-gate.yml"
      - ".github/workflows/publish-release.yml"
      - "moonwitness/**"
      - "dist/**"
      - "tools/assets/**"
      - "showcase/**"
      - "docs/**"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "index.html"
      - "vercel.json"
      - ".github/workflows/**"
      - ".github/workflows/generate-sfx.yml"
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "CHANGELOG.md"
      - "RELEASE.md"
      - "README.md"
      - "manifest.json"
      - "docs/RELEASE-CHECKLIST.md"
      - "docs/PENPOT-LIVE-VERIFICATION.md"
      - "docs/DESIGN-SYSTEM-READINESS.md"
      - ".github/workflows/release-gate.yml"
      - ".github/workflows/publish-release.yml"
      - "moonwitness/**"
      - "dist/**"
      - "tools/assets/**"
      - "showcase/**"
      - "docs/**"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "index.html"
      - "vercel.json"
      - ".github/workflows/**"
      - ".github/workflows/generate-sfx.yml"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release metadata
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const version = fs.readFileSync('VERSION', 'utf8').trim();
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('VERSION must be semver');
          if (manifest.release?.version !== version) throw new Error('manifest release version mismatch');
          if (manifest.release?.status !== 'released') throw new Error('manifest release status must be released');
          if (!changelog.includes(`## [${version}]`)) throw new Error(`CHANGELOG missing ${version} entry`);
          console.log({version, status: manifest.release.status});
          NODE

      - name: Validate all SVG documents as XML
        run: python tools/assets/validate-svg-xml.py

      - name: Validate asset system
        run: node tools/assets/validate.mjs

      - name: Verify research-domain ownership visual
        run: node tools/assets/generate-domain-ownership-visual.mjs --check

      - name: Verify generated brand derivatives
        run: |
          python -m pip install --disable-pip-version-check cairosvg==2.7.1 pillow==10.4.0
          python tools/assets/render-brand.py
          git diff --exit-code -- moonwitness/brand/generated

      - name: Verify generated secondary pack derivatives
        run: |
          python tools/assets/render-packs.py
          git diff --exit-code -- moonwitness

      - name: Verify developer distribution
        run: |
          node tools/assets/build-dist.mjs
          git diff --exit-code -- dist

      - name: Verify showcase JavaScript syntax
        run: node --check showcase/showcase.js

      - name: Verify showcase delivery coverage
        run: node tools/assets/validate-showcase-coverage.mjs

      - name: Verify documentation state
        run: node tools/docs/validate-docs.mjs

      - name: Verify workflow branch policy
        run: node tools/ci/validate-branch-policy.mjs

      - name: Verify runtime motion derivatives
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check pillow==10.4.0
          python tools/assets/generate-runtime-motion.py
          git diff --exit-code -- moonwitness/runtime-motion-pack/png moonwitness/runtime-motion-pack/lottie moonwitness/runtime-motion-pack/generated-manifest.json
          for file in moonwitness/runtime-motion-pack/webm/*.webm; do
            codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$file")"
            width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$file")"
            height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$file")"
            test "$codec" = "vp9"
            test "$width" = "256"
            test "$height" = "256"
          done
          git checkout -- moonwitness/runtime-motion-pack/webm

      - name: Verify generated SFX derivatives
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python tools/assets/generate-sfx.py
          git diff --exit-code -- moonwitness/sfx/generated

      - name: Install locked Penpot builder
        working-directory: tools/penpot
        run: npm ci --no-audit --no-fund

      - name: Validate and generate Penpot package
        working-directory: tools/penpot
        run: npm run check
