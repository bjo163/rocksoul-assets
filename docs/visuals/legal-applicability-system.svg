<svg data-contract="moonwitness-law-v1" xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MoonWitness LAW applicability system</title>
  <desc id="desc">LEGAL TEXT ≠ APPLICABLE LAW. permitted PERMITTED. restricted RESTRICTED. prohibited PROHIBITED. disputed DISPUTED. unresolved UNRESOLVED. Temporal: Was the instrument or rule in force at the relevant time? Territorial: Did the rule extend to the relevant place, conduct, forum, or effects? Personal: Was the actor, entity, State, organization, vessel, or protected class within scope? Subject-matter: Did the rule govern the type of conduct, object, offense, right, or obligation at issue? source SOURCE. authority AUTHORITY. applicability APPLICABILITY. claims COMPETING CLAIMS. review HUMAN REVIEW. legal text presence does not establish applicability. authority does not imply universal scope. source discovery does not produce an automatic verdict. observability is operational metadata, not legal evidence. reviewed legal analysis remains distinct from Mizan and evidence reconstruction.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#242424" stroke-width="1"/></pattern>
    <linearGradient id="boundary" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D1132A" stop-opacity=".28"/><stop offset="1" stop-color="#D1132A" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1200" height="720" fill="#080909"/>
  <rect width="1200" height="720" fill="url(#grid)" opacity=".75"/>
  <rect x="0" y="0" width="1200" height="118" fill="url(#boundary)"/>
  <text x="60" y="44" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="25" font-weight="900">LAW / ANGEL WITH SHOTGUN</text>
  <text x="60" y="80" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="17" font-weight="700" letter-spacing="2">LEGAL TEXT ≠ APPLICABLE LAW</text>
  <text x="60" y="109" fill="#777" font-family="IBM Plex Mono,monospace" font-size="10">RESULT VOCABULARY · REVIEWED CONCLUSION ONLY</text>

  <g font-family="Inter Tight,Inter,Arial,sans-serif" font-weight="800" text-anchor="middle">
    <g transform="translate(60 130)"><rect width="192" height="68" rx="10" fill="#101010" stroke="#3A3A3A" stroke-width="2"/><text x="96" y="29" fill="#F7F4EC" font-size="17">PERMITTED</text><text x="96" y="50" fill="#8E8E8E" font-family="IBM Plex Mono,monospace" font-size="10">permitted</text></g>
    <g transform="translate(282 130)"><rect width="192" height="68" rx="10" fill="#101010" stroke="#3A3A3A" stroke-width="2"/><text x="96" y="29" fill="#F7F4EC" font-size="17">RESTRICTED</text><text x="96" y="50" fill="#8E8E8E" font-family="IBM Plex Mono,monospace" font-size="10">restricted</text></g>
    <g transform="translate(504 130)"><rect width="192" height="68" rx="10" fill="#101010" stroke="#D1132A" stroke-width="2"/><text x="96" y="29" fill="#F7F4EC" font-size="17">PROHIBITED</text><text x="96" y="50" fill="#8E8E8E" font-family="IBM Plex Mono,monospace" font-size="10">prohibited</text></g>
    <g transform="translate(726 130)"><rect width="192" height="68" rx="10" fill="#101010" stroke="#8B6C2E" stroke-width="2"/><text x="96" y="29" fill="#F7F4EC" font-size="17">DISPUTED</text><text x="96" y="50" fill="#8E8E8E" font-family="IBM Plex Mono,monospace" font-size="10">disputed</text></g>
    <g transform="translate(948 130)"><rect width="192" height="68" rx="10" fill="#101010" stroke="#5D6570" stroke-width="2"/><text x="96" y="29" fill="#F7F4EC" font-size="17">UNRESOLVED</text><text x="96" y="50" fill="#8E8E8E" font-family="IBM Plex Mono,monospace" font-size="10">unresolved</text></g>
  </g>

  <text x="60" y="246" fill="#777" font-family="IBM Plex Mono,monospace" font-size="10">APPLICABILITY AXES · EACH AXIS REMAINS INDEPENDENTLY INSPECTABLE</text>

  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(60 270)"><rect width="520" height="104" rx="12" fill="#101010" stroke="#D1132A" stroke-width="2"/><text x="22" y="31" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="700" letter-spacing="1.5">TEMPORAL</text><text x="22" y="62" fill="#F7F4EC" font-size="14">Was the instrument or rule in force at the relevant time?</text></g>
    <g transform="translate(620 270)"><rect width="520" height="104" rx="12" fill="#101010" stroke="#D1132A" stroke-width="2"/><text x="22" y="31" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="700" letter-spacing="1.5">TERRITORIAL</text><text x="22" y="59" fill="#F7F4EC" font-size="14"><tspan x="22">Did the rule extend to the relevant place, conduct, forum,</tspan><tspan x="22" dy="18">or effects?</tspan></text></g>
    <g transform="translate(60 398)"><rect width="520" height="104" rx="12" fill="#101010" stroke="#D1132A" stroke-width="2"/><text x="22" y="31" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="700" letter-spacing="1.5">PERSONAL</text><text x="22" y="59" fill="#F7F4EC" font-size="14"><tspan x="22">Was the actor, entity, State, organization, vessel, or</tspan><tspan x="22" dy="18">protected class within scope?</tspan></text></g>
    <g transform="translate(620 398)"><rect width="520" height="104" rx="12" fill="#101010" stroke="#D1132A" stroke-width="2"/><text x="22" y="31" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="700" letter-spacing="1.5">SUBJECT-MATTER</text><text x="22" y="59" fill="#F7F4EC" font-size="14"><tspan x="22">Did the rule govern the type of conduct, object, offense,</tspan><tspan x="22" dy="18">right, or obligation at issue?</tspan></text></g>
  </g>

  <text x="60" y="548" fill="#777" font-family="IBM Plex Mono,monospace" font-size="10">REVIEW PIPELINE · DISCOVERY ≠ VERDICT</text>
  <g stroke="#D1132A" stroke-width="2" fill="none"><path d="M252 603H276"/><path d="M468 603H492"/><path d="M684 603H708"/><path d="M900 603H924"/></g>
  <g font-family="IBM Plex Mono,monospace" text-anchor="middle">
    <g transform="translate(60 570)"><rect width="192" height="66" rx="10" fill="#111" stroke="#3A3A3A" stroke-width="2"/><text x="96" y="28" fill="#F7F4EC" font-size="11" font-weight="700">SOURCE</text><text x="96" y="48" fill="#777" font-size="9">source</text></g>
    <g transform="translate(276 570)"><rect width="192" height="66" rx="10" fill="#111" stroke="#3A3A3A" stroke-width="2"/><text x="96" y="28" fill="#F7F4EC" font-size="11" font-weight="700">AUTHORITY</text><text x="96" y="48" fill="#777" font-size="9">authority</text></g>
    <g transform="translate(492 570)"><rect width="192" height="66" rx="10" fill="#111" stroke="#D1132A" stroke-width="2"/><text x="96" y="28" fill="#F7F4EC" font-size="11" font-weight="700">APPLICABILITY</text><text x="96" y="48" fill="#777" font-size="9">applicability</text></g>
    <g transform="translate(708 570)"><rect width="192" height="66" rx="10" fill="#111" stroke="#3A3A3A" stroke-width="2"/><text x="96" y="28" fill="#F7F4EC" font-size="11" font-weight="700">COMPETING CLAIMS</text><text x="96" y="48" fill="#777" font-size="9">claims</text></g>
    <g transform="translate(924 570)"><rect width="192" height="66" rx="10" fill="#111" stroke="#3A3A3A" stroke-width="2"/><text x="96" y="28" fill="#F7F4EC" font-size="11" font-weight="700">HUMAN REVIEW</text><text x="96" y="48" fill="#777" font-size="9">review</text></g>
  </g>
  <text x="60" y="681" fill="#777" font-family="IBM Plex Mono,monospace" font-size="9">legal text presence does not establish applicability · authority does not imply universal scope · source discovery does not produce an automatic verdict · observability is operational metadata, not legal evidence · reviewed legal analysis remains distinct from Mizan and evidence reconstruction</text>
</svg>
