<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" role="img" aria-labelledby="title"><title id="title">Application Shell</title><metadata>MoonWitness v2 application surface. Vector-first, editable SVG.</metadata><rect width="1440" height="1024" fill="#0B0B0B"/><rect width="220" height="1024" fill="#151515"/><text x="24" y="46" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="18" font-weight="850">MOON<tspan fill="#D1132A">WITNESS</tspan></text><text x="24" y="82" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9" letter-spacing="2">APPLICATION</text><rect x="16" y="144" width="188" height="36" rx="8" fill="#1B1B1B"/><circle cx="34" cy="162" r="5" fill="#D1132A"/><text x="50" y="168" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">Dashboard</text><rect x="16" y="192" width="188" height="36" rx="8" fill="none"/><circle cx="34" cy="210" r="5" fill="#A3A3A3"/><text x="50" y="216" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500">Cases</text><rect x="16" y="240" width="188" height="36" rx="8" fill="none"/><circle cx="34" cy="258" r="5" fill="#A3A3A3"/><text x="50" y="264" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500">Kanban</text><rect x="16" y="288" width="188" height="36" rx="8" fill="none"/><circle cx="34" cy="306" r="5" fill="#A3A3A3"/><text x="50" y="312" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500">Calendar</text><rect x="16" y="336" width="188" height="36" rx="8" fill="none"/><circle cx="34" cy="354" r="5" fill="#A3A3A3"/><text x="50" y="360" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500">Chat</text><rect x="16" y="384" width="188" height="36" rx="8" fill="none"/><circle cx="34" cy="402" r="5" fill="#A3A3A3"/><text x="50" y="408" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500">AI Workspace</text><rect x="16" y="432" width="188" height="36" rx="8" fill="none"/><circle cx="34" cy="450" r="5" fill="#A3A3A3"/><text x="50" y="456" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500">Resources</text><rect x="16" y="480" width="188" height="36" rx="8" fill="none"/><circle cx="34" cy="498" r="5" fill="#A3A3A3"/><text x="50" y="504" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500">Profile</text><rect x="16" y="528" width="188" height="36" rx="8" fill="none"/><circle cx="34" cy="546" r="5" fill="#A3A3A3"/><text x="50" y="552" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500">Settings</text><line x1="220" y1="0" x2="220" y2="1024" stroke="#2E2E2E"/><rect x="220" y="0" width="1220" height="68" fill="#151515"/><text x="252" y="27" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9" letter-spacing="2">HOME / SHELL</text><text x="252" y="50" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="650">Application Shell</text><rect x="985" y="18" width="152" height="32" rx="16" fill="#0B0B0B" stroke="#2E2E2E"/><circle cx="1004" cy="34" r="5" fill="#10B981"/><text x="1018" y="38" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">BACKEND ONLINE</text><rect x="1150" y="18" width="76" height="32" rx="16" fill="#0B0B0B" stroke="#2E2E2E"/><text x="1188" y="39" text-anchor="middle" fill="#F7F4EC" font-family="IBM Plex Mono,monospace" font-size="10">DARK</text><circle cx="1262" cy="34" r="16" fill="#0B0B0B" stroke="#2E2E2E"/><text x="1262" y="39" text-anchor="middle" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="12">3</text><circle cx="1312" cy="34" r="16" fill="#D1132A"/><text x="1312" y="39" text-anchor="middle" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">RS</text><text x="1342" y="38" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650">Rocksoul</text><text x="24" y="954" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">CMD K / COMMAND</text><text x="24" y="980" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">AUTO MENU / LIVE</text><text x="252" y="130" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="40" font-weight="820">SHARED RESPONSIVE SHELL</text><text x="252" y="170" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="16">Compact sidebar, shared topbar, theme, breadcrumbs, backend status, notifications, and user menu.</text><rect x="252" y="220" width="1156" height="690" fill="#151515" stroke="#2E2E2E"/><text x="280" y="260" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="10">SHELL CONTRACT</text><text x="280" y="310" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">One shell. Multiple resource surfaces.</text><text x="280" y="356" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="15">Navigation remains AutoMenu-driven. The shell owns global controls; screens own resource actions.</text><rect x="280" y="420" width="340" height="150" fill="#0B0B0B" stroke="#2E2E2E"/><text x="304" y="455" fill="#3B82F6" font-family="IBM Plex Mono,monospace" font-size="10">RESPONSIVE</text><text x="304" y="500" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">220 → 72 → drawer</text><text x="304" y="535" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13">Desktop / tablet / mobile</text><rect x="642" y="420" width="340" height="150" fill="#0B0B0B" stroke="#2E2E2E"/><text x="666" y="455" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="10">STATUS</text><text x="666" y="500" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Backend state is global</text><text x="666" y="535" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13">online / degraded / offline</text><rect x="1004" y="420" width="340" height="150" fill="#0B0B0B" stroke="#2E2E2E"/><text x="1028" y="455" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="10">ACCESS</text><text x="1028" y="500" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Role-aware navigation</text><text x="1028" y="535" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13">hide only when permission absent</text></svg>