>Rocksoul</text><text x="24" y="954" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">CMD K / COMMAND</text><text x="24" y="980" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">AUTO MENU / LIVE</text><text x="252" y="126" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="38" font-weight="820">RESOURCE NAVIGATION</text><text x="252" y="160" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="15">AutoMenu-driven. Routes are generated from resource descriptors and permissions.</text><rect x="252" y="210" width="1156" height="660" fill="#151515" stroke="#2E2E2E"/><text x="276" y="250" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">AUTO MENU</text><text x="276" y="300" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="16">Cases</text><text x="600" y="300" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10">/cases</text><text x="1100" y="300" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="9">READ / WRITE</text><line x1="276" y1="324" x2="1380" y2="324" stroke="#2E2E2E"/><text x="276" y="370" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="16">Events</text><text x="600" y="370" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10">/events</text><text x="1100" y="370" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="9">READ / WRITE</text><line x1="276" y1="394" x2="1380" y2="394" stroke="#2E2E2E"/><text x="276" y="440" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="16">People</text><text x="600" y="440" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10">/people</text><text x="1100" y="440" fill="#D89B17" font-family="IBM Plex Mono,monospace" font-size="9">READ / REVIEW</text><line x1="276" y1="464" x2="1380" y2="464" stroke="#2E2E2E"/><text x="276" y="510" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="16">RGBL Sources</text><text x="600" y="510" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10">/sources</text><text x="1100" y="510" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="9">READ / WRITE</text><line x1="276" y1="534" x2="1380" y2="534" stroke="#2E2E2E"/><text x="276" y="580" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="16">AWS Legal</text><text x="600" y="580" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10">/aws</text><text x="1100" y="580" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="9">REVIEWER+</text><line x1="276" y1="604" x2="1380" y2="604" stroke="#2E2E2E"/><text x="276" y="674" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">RULE</text><text x="276" y="710" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="15">If a resource is registered and allowed, AutoMenu exposes it. No hand-maintained duplicate nav.</text></svg>