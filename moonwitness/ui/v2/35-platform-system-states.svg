<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
<title id="title">MoonWitness Platform System States</title>
<desc id="desc">Canonical Platform Admin V2 system-state visual contract with runtime values omitted.</desc>
<rect width="1440" height="1024" fill="#0B0B0B"/><rect width="248" height="1024" fill="#151515"/>
<text x="28" y="46" fill="#F7F4EC" font-family="Inter,Arial" font-size="18" font-weight="850">MOONWITNESS</text>
<text x="28" y="68" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="9" font-weight="800" letter-spacing="1.2">PLATFORM / ADMIN IAM</text>
<rect x="16" y="470" width="216" height="38" rx="6" fill="#1B1B1B" stroke="#D1132A"/>
<circle cx="32" cy="489" r="4" fill="#D1132A"/><text x="48" y="494" fill="#F7F4EC" font-family="Inter,Arial" font-size="13" font-weight="750">System States</text>
<text x="286" y="42" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9" font-weight="800">APPLICATION / V2 / 35</text>
<text x="286" y="90" fill="#F7F4EC" font-family="Inter,Arial" font-size="42" font-weight="820">PLATFORM SYSTEM STATES</text>
<text x="286" y="118" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9" font-weight="700">RUNTIME DATA / NOT BAKED INTO VISUAL SOURCE</text>
<line x1="286" y1="140" x2="1384" y2="140" stroke="#2E2E2E"/>
<g font-family="IBM Plex Mono,monospace" font-size="10" font-weight="800">
<rect x="286" y="178" width="330" height="160" rx="8" fill="#151515" stroke="#3B82F6"/><text x="310" y="210" fill="#3B82F6">LOADING</text><text x="310" y="256" fill="#F7F4EC" font-family="Inter,Arial" font-size="18">PROGRESS / BUSY</text>
<rect x="634" y="178" width="330" height="160" rx="8" fill="#151515" stroke="#2E2E2E"/><text x="658" y="210" fill="#A3A3A3">EMPTY</text><text x="658" y="256" fill="#F7F4EC" font-family="Inter,Arial" font-size="18">NO RECORDS</text>
<rect x="982" y="178" width="330" height="160" rx="8" fill="#151515" stroke="#D1132A"/><text x="1006" y="210" fill="#D1132A">ERROR</text><text x="1006" y="256" fill="#F7F4EC" font-family="Inter,Arial" font-size="18">TRACE ID</text>
<rect x="286" y="360" width="330" height="160" rx="8" fill="#151515" stroke="#D89B17"/><text x="310" y="392" fill="#D89B17">OFFLINE</text><text x="310" y="438" fill="#F7F4EC" font-family="Inter,Arial" font-size="18">LAST KNOWN STATE</text>
<rect x="634" y="360" width="330" height="160" rx="8" fill="#151515" stroke="#D1132A"/><text x="658" y="392" fill="#D1132A">FORBIDDEN</text><text x="658" y="438" fill="#F7F4EC" font-family="Inter,Arial" font-size="18">REQUIRED PERMISSION</text>
<rect x="982" y="360" width="330" height="160" rx="8" fill="#151515" stroke="#D89B17"/><text x="1006" y="392" fill="#D89B17">UNCONFIGURED</text><text x="1006" y="438" fill="#F7F4EC" font-family="Inter,Arial" font-size="18">FAIL CLOSED</text>
</g>
<rect x="286" y="550" width="1026" height="160" rx="8" fill="#151515" stroke="#2E2E2E"/>
<text x="310" y="584" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="800">ONE RECOVERY LANGUAGE</text>
<text x="310" y="626" fill="#F7F4EC" font-family="Inter,Arial" font-size="15" font-weight="650">Every state explains what happened, what is known, and what the operator can do next.</text>
</svg>