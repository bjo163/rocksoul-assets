nt-weight="650">Rocksoul</text><text x="24" y="954" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">CMD K / COMMAND</text><text x="24" y="980" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">AUTO MENU / LIVE</text><text x="252" y="126" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="38" font-weight="820">AUTHORIZATION UX</text><text x="252" y="160" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="15">Permissions are explained before actions fail.</text><rect x="252" y="210" width="1156" height="660" fill="#151515" stroke="#2E2E2E"/><text x="278" y="254" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Role: Researcher</text><text x="278" y="286" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13">Can inspect and review evidence. Cannot publish legal decisions.</text><text x="278" y="350" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">CAPABILITY</text><text x="690" y="350" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">ACCESS</text><text x="278" y="402" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="15">View canonical records</text><text x="690" y="402" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="9">ALLOWED</text><text x="278" y="452" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="15">Request context</text><text x="690" y="452" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="9">ALLOWED</text><text x="278" y="502" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="15">Resolve identity blocker</text><text x="690" y="502" fill="#D89B17" font-family="IBM Plex Mono,monospace" font-size="9">REQUIRES EVIDENCE</text><text x="278" y="552" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="15">Publish legal conclusion</text><text x="690" y="552" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="9">LEGAL REVIEWER+</text><rect x="900" y="350" width="440" height="230" fill="#0B0B0B" stroke="#D1132A"/><text x="924" y="390" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="9">ACTION BLOCKED</text><text x="924" y="430" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">You can’t publish this decision.</text><text x="924" y="468" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="13">Legal Reviewer or Admin is required.</text><rect x="924" y="510" width="170" height="40" rx="7" fill="#D1132A"/><text x="1009" y="535" text-anchor="middle" fill="#F7F4EC" font-family="IBM Plex Mono,monospace" font-size="9">REQUEST ACCESS</text></svg>