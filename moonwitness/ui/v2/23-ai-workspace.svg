ext><rect x="16" y="432" width="188" height="36" rx="8" fill="none"/><circle cx="34" cy="450" r="5" fill="#A3A3A3"/><text x="50" y="456" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500">Resources</text><rect x="16" y="480" width="188" height="36" rx="8" fill="none"/><circle cx="34" cy="498" r="5" fill="#A3A3A3"/><text x="50" y="504" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500">Profile</text><rect x="16" y="528" width="188" height="36" rx="8" fill="none"/><circle cx="34" cy="546" r="5" fill="#A3A3A3"/><text x="50" y="552" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500">Settings</text><line x1="220" y1="0" x2="220" y2="1024" stroke="#2E2E2E"/><rect x="220" y="0" width="1220" height="68" fill="#151515"/><text x="252" y="27" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9" letter-spacing="2">WORK / AI</text><text x="252" y="50" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="650">AI Workspace</text><rect x="985" y="18" width="152" height="32" rx="16" fill="#0B0B0B" stroke="#2E2E2E"/><circle cx="1004" cy="34" r="5" fill="#10B981"/><text x="1018" y="38" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">BACKEND ONLINE</text><rect x="1150" y="18" width="76" height="32" rx="16" fill="#0B0B0B" stroke="#2E2E2E"/><text x="1188" y="39" text-anchor="middle" fill="#F7F4EC" font-family="IBM Plex Mono,monospace" font-size="10">DARK</text><circle cx="1262" cy="34" r="16" fill="#0B0B0B" stroke="#2E2E2E"/><text x="1262" y="39" text-anchor="middle" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="12">3</text><circle cx="1312" cy="34" r="16" fill="#D1132A"/><text x="1312" y="39" text-anchor="middle" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">RS</text><text x="1342" y="38" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650">Rocksoul</text><text x="24" y="954" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">CMD K / COMMAND</text><text x="24" y="980" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">AUTO MENU / LIVE</text><text x="252" y="126" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="38" font-weight="820">AI WORKSPACE</text><text x="252" y="160" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="15">Ask across records. Keep citations visible. Never collapse uncertainty.</text><rect x="252" y="200" width="760" height="690" fill="#151515" stroke="#2E2E2E"/><text x="278" y="240" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">CONVERSATION</text><rect x="278" y="278" width="708" height="92" rx="8" fill="#0B0B0B"/><text x="300" y="312" fill="#3B82F6" font-family="IBM Plex Mono,monospace" font-size="9">YOU</text><text x="300" y="342" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="14">Why is MW-0042 still unresolved?</text><rect x="278" y="390" width="708" height="260" rx="8" fill="#0B0B0B" stroke="#2E2E2E"/><text x="300" y="424" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="9">MOONWITNESS AI</text><text x="300" y="458" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="14">Temporal and motif signals are strong, but identity remains partial.</text><text x="300" y="490" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="14">The legal layer also has unresolved jurisdiction.</text><text x="300" y="540" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">CITATIONS</text><text x="300" y="572" fill="#10B981" font-family="Inter,Arial,sans-serif" font-size="13">EVENT-0042-A · PERSON-0042-A · AWS-0042-A</text><text x="300" y="610" fill="#D89B17" font-family="Inter,Arial,sans-serif" font-size="13">Correlation supports investigation, not closure.</text><rect x="278" y="800" width="708" height="58" rx="8" fill="#0B0B0B" stroke="#2E2E2E"/><text x="300" y="836" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14">Ask with case context…</text><rect x="1036" y="200" width="372" height="690" fill="#151515" stroke="#2E2E2E"/><text x="1060" y="240" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">Context</text><text x="1060" y="286" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">CASE</text><text x="1060" y="316" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="14">MW-0042 / The Silent Flight</text><text x="1060" y="370" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">SOURCES</text><text x="1060" y="402" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="13">4 canonical records</text><text x="1060" y="432" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="13">2 legal instruments</text><text x="1060" y="462" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="13">17 discussions</text></svg>