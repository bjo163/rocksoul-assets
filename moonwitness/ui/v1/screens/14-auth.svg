<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc"><title id="title">Authentication</title><desc id="desc">Editable vector reconstruction of the MoonWitness Authentication raster baseline.</desc><metadata>MoonWitness vector counterpart. Raster reference remains immutable; this SVG is editable design source.</metadata><rect width="1440" height="1024" fill="#0B0B0B"/><text x="56" y="54" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="18" font-weight="800">MOONWITNESS</text><text x="1384" y="54" text-anchor="end" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="4">VECTOR / V1</text><line x1="56" y1="76" x2="1384" y2="76" stroke="#2E2E2E"/><rect x="160" y="160" width="1120" height="700" fill="#151515" stroke="#2E2E2E"/><text x="720" y="245" text-anchor="middle" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="54" font-weight="820">ENTER THE OBSERVATORY.</text><text x="720" y="287" text-anchor="middle" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="17">Sign in to follow cases, save records, and submit context.</text><text x="390" y="380" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10">EMAIL</text><rect x="390" y="398" width="660" height="62" fill="#0B0B0B" stroke="#2E2E2E"/><text x="414" y="437" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="16">you@example.com</text><text x="390" y="510" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10">PASSWORD</text><rect x="390" y="528" width="660" height="62" fill="#0B0B0B" stroke="#2E2E2E"/><text x="414" y="567" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="16">••••••••••••</text><rect x="390" y="640" width="660" height="62" fill="#D1132A"/><text x="720" y="680" text-anchor="middle" fill="#F7F4EC" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="700">SIGN IN</text><line x1="390" y1="752" x2="1050" y2="752" stroke="#2E2E2E"/><text x="720" y="800" text-anchor="middle" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14">By continuing, you agree to evidence-integrity and community rules.</text></svg>