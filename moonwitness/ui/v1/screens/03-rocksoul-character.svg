<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc"><title id="title">Rocksoul Character</title><desc id="desc">Editable vector reconstruction of the MoonWitness Rocksoul Character raster baseline.</desc><metadata>MoonWitness vector counterpart. Raster reference remains immutable; this SVG is editable design source.</metadata><rect width="1440" height="1024" fill="#0B0B0B"/><text x="56" y="54" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="18" font-weight="800">MOONWITNESS</text><text x="1384" y="54" text-anchor="end" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="4">VECTOR / V1</text><line x1="56" y1="76" x2="1384" y2="76" stroke="#2E2E2E"/><text x="56" y="160" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="4">CHARACTER / ROCKSOUL</text><text x="56" y="250" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="72" font-weight="850">THE ONE WHO FOLLOWS</text><text x="56" y="306" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="20">MoonWitness watches. Rocksoul follows the trace.</text><circle cx="350" cy="610" r="170" fill="#151515" stroke="#2E2E2E" stroke-width="2"/><path d="M270 690c24-90 42-124 80-160 38 36 56 70 80 160Z" fill="#222"/><circle cx="350" cy="500" r="68" fill="#222" stroke="#D1132A" stroke-width="2"/><path d="M309 504c24-18 58-18 82 0" stroke="#F7F4EC" stroke-width="3"/><path d="M350 472l8 24 24 8-24 8-8 24-8-24-24-8 24-8Z" fill="#D1132A"/><rect x="650" y="400" width="330" height="150" fill="#151515" stroke="#2E2E2E"/><text x="670" y="430" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">TRAIT / 01</text><text x="670" y="466" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">CURIOUS, NOT GULLIBLE</text><rect x="1000" y="400" width="330" height="150" fill="#151515" stroke="#2E2E2E"/><text x="1020" y="430" fill="#D89B17" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">TRAIT / 02</text><text x="1020" y="466" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">REBEL, NOT RECKLESS</text><rect x="650" y="575" width="330" height="150" fill="#151515" stroke="#2E2E2E"/><text x="670" y="605" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">TRAIT / 03</text><text x="670" y="641" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">HUMAN, NOT VAGUE</text><rect x="1000" y="575" width="330" height="150" fill="#151515" stroke="#2E2E2E"/><text x="1020" y="605" fill="#3B82F6" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">TRAIT / 04</text><text x="1020" y="641" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">SHARP, NOT COLD</text><text x="650" y="820" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="12" letter-spacing="3">ROLE / GUIDE THROUGH UNCERTAINTY</text></svg>