<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc"><title id="title">Story Repository</title><desc id="desc">Editable vector reconstruction of the MoonWitness Story Repository raster baseline.</desc><metadata>MoonWitness vector counterpart. Raster reference remains immutable; this SVG is editable design source.</metadata><rect width="1440" height="1024" fill="#0B0B0B"/><text x="56" y="54" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="18" font-weight="800">MOONWITNESS</text><text x="1384" y="54" text-anchor="end" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="4">VECTOR / V1</text><line x1="56" y1="76" x2="1384" y2="76" stroke="#2E2E2E"/><text x="56" y="160" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="4">STORY / ROCKSOUL-LEGEND</text><text x="56" y="238" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="60" font-weight="820">WHAT WAS TOLD?</text><rect x="56" y="330" width="820" height="470" fill="#151515" stroke="#2E2E2E"/><text x="88" y="378" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="11">SOURCE / ARCHIVE NOTE / 0042</text><text x="88" y="452" fill="#F7F4EC" font-family="Georgia,serif" font-size="34" font-style="italic">“A route nobody remembers taking.”</text><text x="88" y="515" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="18">A recurring account describes a silent departure,</text><text x="88" y="548" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="18">a missing interval, and a return before sunrise.</text><line x1="88" y1="625" x2="842" y2="625" stroke="#2E2E2E"/><text x="88" y="670" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="11">SOURCE-LINKED</text><text x="88" y="710" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10">PROVENANCE / fixture/story/0042/a</text><rect x="930" y="330" width="454" height="160" fill="#151515" stroke="#2E2E2E"/><text x="950" y="360" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">PROVENANCE</text><text x="950" y="396" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">SOURCE CHAIN</text><rect x="930" y="515" width="454" height="160" fill="#151515" stroke="#2E2E2E"/><text x="950" y="545" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">RELATION</text><text x="950" y="581" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">MOTIF / MOVEMENT</text><rect x="930" y="700" width="454" height="100" fill="#151515" stroke="#2E2E2E"/><text x="950" y="730" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">STATUS</text><text x="950" y="766" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">SUPPORTED</text></svg>