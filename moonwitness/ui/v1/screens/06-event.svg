<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc"><title id="title">Event Repository</title><desc id="desc">Editable vector reconstruction of the MoonWitness Event Repository raster baseline.</desc><metadata>MoonWitness vector counterpart. Raster reference remains immutable; this SVG is editable design source.</metadata><rect width="1440" height="1024" fill="#0B0B0B"/><text x="56" y="54" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="18" font-weight="800">MOONWITNESS</text><text x="1384" y="54" text-anchor="end" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="4">VECTOR / V1</text><line x1="56" y1="76" x2="1384" y2="76" stroke="#2E2E2E"/><text x="56" y="160" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="4">EVENT / ROCKSOUL-EVENT</text><text x="56" y="238" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="60" font-weight="820">WHAT ACTUALLY HAPPENED?</text><line x1="170" y1="420" x2="1270" y2="420" stroke="#2E2E2E" stroke-width="4"/><circle cx="310" cy="420" r="18" fill="#10B981"/><circle cx="690" cy="420" r="18" fill="#D1132A"/><circle cx="1030" cy="420" r="18" fill="#10B981"/><text x="310" y="380" text-anchor="middle" fill="#F7F4EC" font-family="IBM Plex Mono,monospace" font-size="14">02:14</text><text x="690" y="380" text-anchor="middle" fill="#F7F4EC" font-family="IBM Plex Mono,monospace" font-size="14">02:37</text><text x="1030" y="380" text-anchor="middle" fill="#F7F4EC" font-family="IBM Plex Mono,monospace" font-size="14">RETURN</text><rect x="170" y="500" width="360" height="190" fill="#151515" stroke="#2E2E2E"/><text x="190" y="530" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">EVENT-0042-A</text><text x="190" y="566" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">MOVEMENT RECORDED</text><rect x="550" y="500" width="360" height="190" fill="#151515" stroke="#2E2E2E"/><text x="570" y="530" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">WINDOW</text><text x="570" y="566" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">MISSING INTERVAL</text><rect x="930" y="500" width="340" height="190" fill="#151515" stroke="#2E2E2E"/><text x="950" y="530" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">VERIFY</text><text x="950" y="566" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">TIMESTAMP LINKED</text><text x="170" y="770" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="18">Time is evidence. Sequence is context. Neither is a conclusion by itself.</text></svg>