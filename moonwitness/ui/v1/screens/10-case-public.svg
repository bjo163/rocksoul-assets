<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc"><title id="title">Public Case</title><desc id="desc">Editable vector reconstruction of the MoonWitness Public Case raster baseline.</desc><metadata>MoonWitness vector counterpart. Raster reference remains immutable; this SVG is editable design source.</metadata><rect width="1440" height="1024" fill="#0B0B0B"/><text x="56" y="54" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="18" font-weight="800">MOONWITNESS</text><text x="1384" y="54" text-anchor="end" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="4">VECTOR / V1</text><line x1="56" y1="76" x2="1384" y2="76" stroke="#2E2E2E"/><text x="56" y="150" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="4">CASE / MW-0042 / PUBLIC</text><text x="56" y="236" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="72" font-weight="840">THE SILENT FLIGHT</text><text x="56" y="286" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="19">Four separate records appear to line up around one unexplained movement.</text><rect x="56" y="330" width="1328" height="80" fill="#151515" stroke="#2E2E2E"/><text x="82" y="362" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10">STATUS</text><text x="82" y="392" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">UNRESOLVED</text><text x="380" y="362" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10">CORRELATION</text><text x="380" y="392" fill="#10B981" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">0.87 / MEDIUM-HIGH</text><text x="760" y="362" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10">LEGAL</text><text x="760" y="392" fill="#D89B17" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">DISPUTED</text><rect x="56" y="455" width="310" height="210" fill="#151515" stroke="#2E2E2E"/><text x="76" y="485" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">STORY</text><text x="76" y="521" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">SOURCE-LINKED</text><rect x="386" y="455" width="310" height="210" fill="#151515" stroke="#2E2E2E"/><text x="406" y="485" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">EVENT</text><text x="406" y="521" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">TIMESTAMPED</text><rect x="716" y="455" width="310" height="210" fill="#151515" stroke="#2E2E2E"/><text x="736" y="485" fill="#D89B17" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">PERSON</text><text x="736" y="521" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">PARTIAL</text><rect x="1046" y="455" width="338" height="210" fill="#151515" stroke="#2E2E2E"/><text x="1066" y="485" fill="#3B82F6" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">RGBL</text><text x="1066" y="521" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">SEMANTIC MATCH</text><text x="76" y="606" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14">Independent record</text><text x="406" y="606" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14">Independent record</text><text x="736" y="606" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14">Identity incomplete</text><text x="1066" y="606" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14">Causation not claimed</text><rect x="56" y="710" width="870" height="120" fill="#151515" stroke="#2E2E2E"/><text x="82" y="752" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">The trails are starting to line up.</text><text x="82" y="790" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="16">Enough to investigate. Not enough to close.</text><rect x="950" y="710" width="434" height="120" fill="#D1132A"/><text x="1167" y="780" text-anchor="middle" fill="#F7F4EC" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="700">EXPLORE CORRELATION →</text></svg>