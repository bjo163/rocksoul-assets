<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc"><title id="title">Person Repository</title><desc id="desc">Editable vector reconstruction of the MoonWitness Person Repository raster baseline.</desc><metadata>MoonWitness vector counterpart. Raster reference remains immutable; this SVG is editable design source.</metadata><rect width="1440" height="1024" fill="#0B0B0B"/><text x="56" y="54" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="18" font-weight="800">MOONWITNESS</text><text x="1384" y="54" text-anchor="end" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="4">VECTOR / V1</text><line x1="56" y1="76" x2="1384" y2="76" stroke="#2E2E2E"/><text x="56" y="160" fill="#D89B17" font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="4">PERSON / ROCKSOUL-SUPERHERO</text><text x="56" y="238" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="60" font-weight="820">WHO CROSSED THE FRAME?</text><rect x="56" y="330" width="400" height="500" fill="#151515" stroke="#2E2E2E"/><circle cx="256" cy="510" r="90" fill="#222" stroke="#D89B17" stroke-width="2"/><path d="M150 760c20-110 60-150 106-150s86 40 106 150Z" fill="#222"/><text x="256" y="790" text-anchor="middle" fill="#D89B17" font-family="IBM Plex Mono,monospace" font-size="11">IDENTITY / PARTIAL</text><rect x="520" y="330" width="410" height="150" fill="#151515" stroke="#2E2E2E"/><text x="540" y="360" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">ATTRIBUTE / ROLE</text><text x="540" y="396" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">MATCH</text><rect x="950" y="330" width="410" height="150" fill="#151515" stroke="#2E2E2E"/><text x="970" y="360" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">ATTRIBUTE / MOVEMENT</text><text x="970" y="396" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">MATCH</text><rect x="520" y="505" width="840" height="150" fill="#151515" stroke="#2E2E2E"/><text x="540" y="535" fill="#D89B17" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">ATTRIBUTE / IDENTITY</text><text x="540" y="571" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">NOT VERIFIED</text><rect x="520" y="680" width="840" height="150" fill="#151515" stroke="#D1132A"/><text x="544" y="715" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11">BLOCKING UNCERTAINTY</text><text x="544" y="760" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Two attributes line up. One key identity field does not.</text></svg>