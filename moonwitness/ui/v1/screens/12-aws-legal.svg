<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc"><title id="title">AWS Legal</title><desc id="desc">Editable vector reconstruction of the MoonWitness AWS Legal raster baseline.</desc><metadata>MoonWitness vector counterpart. Raster reference remains immutable; this SVG is editable design source.</metadata><rect width="1440" height="1024" fill="#0B0B0B"/><text x="56" y="54" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="18" font-weight="800">MOONWITNESS</text><text x="1384" y="54" text-anchor="end" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="4">VECTOR / V1</text><line x1="56" y1="76" x2="1384" y2="76" stroke="#2E2E2E"/><text x="56" y="150" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="4">THE BOUNDARY / AWS</text><text x="56" y="235" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="66" font-weight="840">COOL. NOW THE LAW GETS INVOLVED.</text><line x1="56" y1="292" x2="1384" y2="292" stroke="#D1132A" stroke-width="3"/><text x="56" y="350" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="19">Evidence asks what happened. Law asks what rule would apply.</text><rect x="56" y="430" width="620" height="180" fill="#151515" stroke="#2E2E2E"/><text x="76" y="460" fill="#D89B17" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">JURISDICTION</text><text x="76" y="496" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">UNRESOLVED / FIXTURE</text><rect x="706" y="430" width="678" height="180" fill="#151515" stroke="#2E2E2E"/><text x="726" y="460" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">REVIEW STATE</text><text x="726" y="496" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">NEEDS LEGAL REVIEW</text><rect x="56" y="650" width="1328" height="200" fill="#151515" stroke="#2E2E2E"/><text x="82" y="692" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11">LEGAL INSTRUMENTS</text><text x="82" y="742" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">LAW-FIX-01 — Synthetic Cross-Border Movement Instrument</text><text x="82" y="782" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">LAW-FIX-02 — Synthetic Protected-Passage Rule</text><text x="82" y="824" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="15">Both are reference-only fixture instruments. No court judgment is implied.</text></svg>