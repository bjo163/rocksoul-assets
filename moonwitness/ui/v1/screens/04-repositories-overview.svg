<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc"><title id="title">Repositories Overview</title><desc id="desc">Editable vector reconstruction of the MoonWitness Repositories Overview raster baseline.</desc><metadata>MoonWitness vector counterpart. Raster reference remains immutable; this SVG is editable design source.</metadata><rect width="1440" height="1024" fill="#0B0B0B"/><text x="56" y="54" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="18" font-weight="800">MOONWITNESS</text><text x="1384" y="54" text-anchor="end" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="4">VECTOR / V1</text><line x1="56" y1="76" x2="1384" y2="76" stroke="#2E2E2E"/><text x="56" y="160" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="4">SOURCE LAYERS</text><text x="56" y="235" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="60" font-weight="820">FIVE QUESTIONS. ONE RECORD.</text><text x="56" y="282" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="18">Each repository answers a different question. None is allowed to impersonate the others.</text><rect x="56" y="360" width="250" height="250" fill="#151515" stroke="#2E2E2E"/><text x="76" y="390" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">STORY</text><text x="76" y="426" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">WHAT WAS TOLD?</text><rect x="326" y="360" width="250" height="250" fill="#151515" stroke="#2E2E2E"/><text x="346" y="390" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">EVENT</text><text x="346" y="426" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">WHAT HAPPENED?</text><rect x="596" y="360" width="250" height="250" fill="#151515" stroke="#2E2E2E"/><text x="616" y="390" fill="#D89B17" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">PERSON</text><text x="616" y="426" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">WHO CROSSED?</text><rect x="866" y="360" width="250" height="250" fill="#151515" stroke="#2E2E2E"/><text x="886" y="390" fill="#3B82F6" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">RGBL</text><text x="886" y="426" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">WHAT DOES IT SAY?</text><rect x="1136" y="360" width="250" height="250" fill="#151515" stroke="#2E2E2E"/><text x="1156" y="390" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">AWS</text><text x="1156" y="426" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">WAS IT ALLOWED?</text><text x="76" y="485" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14">rocksoul-legend</text><text x="346" y="485" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14">rocksoul-event</text><text x="616" y="485" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14">rocksoul-superhero</text><text x="886" y="485" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14">rocksoul-rgbl</text><text x="1156" y="485" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14">rocksoul-aws</text><path d="M180 730H1260" stroke="#2E2E2E" stroke-width="3"/><circle cx="180" cy="730" r="14" fill="#D1132A"/><circle cx="450" cy="730" r="14" fill="#10B981"/><circle cx="720" cy="730" r="14" fill="#D89B17"/><circle cx="990" cy="730" r="14" fill="#3B82F6"/><circle cx="1260" cy="730" r="14" fill="#D1132A"/><text x="720" y="805" text-anchor="middle" fill="#F7F4EC" font-family="IBM Plex Mono,monospace" font-size="13" letter-spacing="6">THE RECORD CONNECTS.</text></svg>