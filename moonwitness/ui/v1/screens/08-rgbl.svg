<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc"><title id="title">RGBL Repository</title><desc id="desc">Editable vector reconstruction of the MoonWitness RGBL Repository raster baseline.</desc><metadata>MoonWitness vector counterpart. Raster reference remains immutable; this SVG is editable design source.</metadata><rect width="1440" height="1024" fill="#0B0B0B"/><text x="56" y="54" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="18" font-weight="800">MOONWITNESS</text><text x="1384" y="54" text-anchor="end" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="4">VECTOR / V1</text><line x1="56" y1="76" x2="1384" y2="76" stroke="#2E2E2E"/><text x="56" y="160" fill="#3B82F6" font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="4">RGBL / ROCKSOUL-RGBL</text><text x="56" y="238" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="60" font-weight="820">WHAT DOES THE SOURCE SAY?</text><circle cx="350" cy="540" r="170" fill="none" stroke="#2E2E2E" stroke-width="2"/><circle cx="310" cy="500" r="82" fill="#D1132A" opacity=".5"/><circle cx="390" cy="500" r="82" fill="#10B981" opacity=".5"/><circle cx="350" cy="580" r="82" fill="#3B82F6" opacity=".5"/><circle cx="350" cy="540" r="28" fill="#F7F4EC"/><text x="350" y="760" text-anchor="middle" fill="#F7F4EC" font-family="IBM Plex Mono,monospace" font-size="12" letter-spacing="4">LIGHT / UNRESOLVED RELATION</text><rect x="650" y="360" width="690" height="120" fill="#151515" stroke="#2E2E2E"/><text x="670" y="390" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">RED / MOVEMENT</text><text x="670" y="426" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">MOVEMENT SIGNAL</text><rect x="650" y="500" width="690" height="120" fill="#151515" stroke="#2E2E2E"/><text x="670" y="530" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">GREEN / RETURN</text><text x="670" y="566" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">RETURN SIGNAL</text><rect x="650" y="640" width="690" height="120" fill="#151515" stroke="#2E2E2E"/><text x="670" y="670" fill="#3B82F6" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">BLUE / NIGHT</text><text x="670" y="706" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">NIGHT SIGNAL</text><text x="650" y="825" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="18">Semantic relation is present. Causal relation is not established.</text></svg>