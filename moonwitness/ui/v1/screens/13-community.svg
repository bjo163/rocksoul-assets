<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc"><title id="title">Community</title><desc id="desc">Editable vector reconstruction of the MoonWitness Community raster baseline.</desc><metadata>MoonWitness vector counterpart. Raster reference remains immutable; this SVG is editable design source.</metadata><rect width="1440" height="1024" fill="#0B0B0B"/><text x="56" y="54" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="18" font-weight="800">MOONWITNESS</text><text x="1384" y="54" text-anchor="end" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="4">VECTOR / V1</text><line x1="56" y1="76" x2="1384" y2="76" stroke="#2E2E2E"/><text x="56" y="150" fill="#3B82F6" font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="4">COMMUNITY / CASE MW-0042</text><text x="56" y="225" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="58" font-weight="820">DISCUSS WITHOUT MUTATING THE RECORD.</text><rect x="56" y="300" width="860" height="530" fill="#151515" stroke="#2E2E2E"/><text x="82" y="342" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10">THREAD / 17 DISCUSSIONS</text><rect x="82" y="380" width="808" height="130" fill="#0B0B0B" stroke="#2E2E2E"/><text x="106" y="414" fill="#3B82F6" font-family="IBM Plex Mono,monospace" font-size="10">MEMBER / QUESTION</text><text x="106" y="456" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="17">If the person match is partial, why is the overall correlation still high?</text><rect x="82" y="535" width="808" height="150" fill="#0B0B0B" stroke="#2E2E2E"/><text x="106" y="570" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="10">MODERATOR NOTE</text><text x="106" y="612" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="17">Temporal and source-independence dimensions are strong.</text><text x="106" y="644" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="15">Identity remains a blocking uncertainty and is shown separately.</text><rect x="82" y="720" width="808" height="80" fill="#0B0B0B" stroke="#2E2E2E"/><text x="108" y="770" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="16">Write a question or add context…</text><rect x="950" y="300" width="434" height="150" fill="#151515" stroke="#2E2E2E"/><text x="970" y="330" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">FOLLOWING</text><text x="970" y="366" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">128</text><rect x="950" y="475" width="434" height="150" fill="#151515" stroke="#2E2E2E"/><text x="970" y="505" fill="#3B82F6" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">SAVED</text><text x="970" y="541" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">44</text><rect x="950" y="650" width="434" height="180" fill="#151515" stroke="#2E2E2E"/><text x="970" y="680" fill="#D89B17" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700">SUBMISSION</text><text x="970" y="716" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="20" font-weight="750">NEEDS CONTEXT</text></svg>