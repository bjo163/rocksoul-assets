<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc"><title id="title">Manifesto</title><desc id="desc">Editable vector reconstruction of the MoonWitness Manifesto raster baseline.</desc><metadata>MoonWitness vector counterpart. Raster reference remains immutable; this SVG is editable design source.</metadata><rect width="1440" height="1024" fill="#0B0B0B"/><text x="56" y="54" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="18" font-weight="800">MOONWITNESS</text><text x="1384" y="54" text-anchor="end" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="4">VECTOR / V1</text><line x1="56" y1="76" x2="1384" y2="76" stroke="#2E2E2E"/><text x="56" y="178" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="5">THE WORK</text><text x="56" y="300" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="86" font-weight="800">WATCH.</text><text x="56" y="390" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="86" font-weight="800">CORRELATE.</text><text x="56" y="480" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="86" font-weight="800">PRESERVE.</text><text x="56" y="570" fill="#D1132A" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="86" font-weight="800">DON'T PRETEND.</text><line x1="760" y1="170" x2="760" y2="850" stroke="#2E2E2E"/><text x="820" y="220" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">A record is not a verdict.</text><text x="820" y="275" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="18">Story is not event.</text><text x="820" y="315" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="18">Correlation is not causation.</text><text x="820" y="355" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="18">Legal analysis is not judgment.</text><text x="820" y="430" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Unresolved is a valid output.</text><text x="820" y="505" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="12" letter-spacing="4">EVIDENCE OVER NOISE</text><path d="M820 560H1310" stroke="#D1132A" stroke-width="3"/><text x="820" y="618" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="44" font-weight="800">STAY CURIOUS.</text><text x="820" y="672" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="44" font-weight="800">KEEP THE RECEIPTS.</text></svg>