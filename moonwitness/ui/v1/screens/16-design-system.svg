<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc"><title id="title">Design System</title><desc id="desc">Editable vector reconstruction of the MoonWitness Design System raster baseline.</desc><metadata>MoonWitness vector counterpart. Raster reference remains immutable; this SVG is editable design source.</metadata><rect width="1440" height="1024" fill="#0B0B0B"/><text x="56" y="54" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="18" font-weight="800">MOONWITNESS</text><text x="1384" y="54" text-anchor="end" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="4">VECTOR / V1</text><line x1="56" y1="76" x2="1384" y2="76" stroke="#2E2E2E"/><text x="56" y="150" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="4">DESIGN SYSTEM / V0.2</text><text x="56" y="224" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="60" font-weight="820">TOKEN → PRIMITIVE → COMPONENT → PATTERN → SCREEN</text><text x="56" y="292" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="11">COLOR</text><rect x="56" y="320" width="120" height="80" fill="#D1132A"/><rect x="192" y="320" width="120" height="80" fill="#10B981"/><rect x="328" y="320" width="120" height="80" fill="#3B82F6"/><rect x="464" y="320" width="120" height="80" fill="#D89B17"/><rect x="600" y="320" width="120" height="80" fill="#F7F4EC"/><text x="56" y="458" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="11">PRIMITIVES</text><rect x="56" y="486" width="180" height="48" fill="#D1132A"/><text x="146" y="517" text-anchor="middle" fill="#F7F4EC" font-family="IBM Plex Mono,monospace" font-size="11">PRIMARY BUTTON</text><rect x="260" y="486" width="180" height="48" fill="none" stroke="#2E2E2E"/><text x="350" y="517" text-anchor="middle" fill="#F7F4EC" font-family="IBM Plex Mono,monospace" font-size="11">SECONDARY</text><rect x="464" y="486" width="240" height="48" fill="#151515" stroke="#2E2E2E"/><text x="484" y="517" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="14">Search evidence…</text><text x="56" y="602" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="11">SEMANTIC STATUS</text><rect x="56" y="630" width="150" height="38" rx="19" fill="#151515" stroke="#10B981"/><text x="131" y="654" text-anchor="middle" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="10">SUPPORTED</text><rect x="226" y="630" width="150" height="38" rx="19" fill="#151515" stroke="#D89B17"/><text x="301" y="654" text-anchor="middle" fill="#D89B17" font-family="IBM Plex Mono,monospace" font-size="10">PARTIAL</text><rect x="396" y="630" width="150" height="38" rx="19" fill="#151515" stroke="#D1132A"/><text x="471" y="654" text-anchor="middle" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="10">DISPUTED</text><rect x="820" y="320" width="564" height="460" fill="#151515" stroke="#2E2E2E"/><text x="850" y="365" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="30" font-weight="800">COMPONENT CONTRACT</text><text x="850" y="422" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="11">MW / EVIDENCE CARD / STORY / DEFAULT</text><rect x="850" y="460" width="504" height="240" fill="#0B0B0B" stroke="#2E2E2E"/><text x="878" y="500" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="10">STORY</text><text x="878" y="548" fill="#F7F4EC" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">A route nobody remembers taking</text><text x="878" y="592" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="15">Provenance, verification, status, actions.</text><text x="878" y="660" fill="#10B981" font-family="IBM Plex Mono,monospace" font-size="10">SOURCE-LINKED</text></svg>