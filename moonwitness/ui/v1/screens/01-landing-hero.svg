<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc"><title id="title">Landing Hero</title><desc id="desc">Editable vector reconstruction of the MoonWitness Landing Hero raster baseline.</desc><metadata>MoonWitness vector counterpart. Raster reference remains immutable; this SVG is editable design source.</metadata><rect width="1440" height="1024" fill="#0B0B0B"/><text x="56" y="54" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="18" font-weight="800">MOONWITNESS</text><text x="1384" y="54" text-anchor="end" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="4">VECTOR / V1</text><line x1="56" y1="76" x2="1384" y2="76" stroke="#2E2E2E"/><text x="56" y="190" fill="#D1132A" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="700" letter-spacing="4">INDEPENDENT OBSERVATORY</text><text x="56" y="330" fill="#F7F4EC" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="128" font-weight="850" letter-spacing="-6">MOON</text><text x="56" y="452" fill="#D1132A" font-family="Inter Tight,Inter,Arial,sans-serif" font-size="128" font-weight="850" letter-spacing="-6">WITNESS</text><text x="64" y="520" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="22">What was told. What happened. Who crossed the frame.</text><text x="64" y="556" fill="#A3A3A3" font-family="Inter,Arial,sans-serif" font-size="22">What the source says. Where the law draws the line.</text><rect x="56" y="625" width="220" height="54" fill="#D1132A"/><text x="166" y="660" text-anchor="middle" fill="#F7F4EC" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="700">ENTER OBSERVATORY</text><circle cx="1110" cy="430" r="210" fill="none" stroke="#2E2E2E" stroke-width="2"/><path d="M1086 220A210 210 0 1 0 1086 640C1005 596 956 520 956 430s49-166 130-210Z" fill="#F7F4EC"/><path d="M870 430c72-92 151-136 240-136s168 44 240 136c-72 92-151 136-240 136S942 522 870 430Z" f