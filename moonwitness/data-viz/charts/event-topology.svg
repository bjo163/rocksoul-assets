<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Event intelligence topology</title><desc id="desc">Canonical event connected to claims, evidence, sources, place, artifact and external relationships.</desc><rect width="640" height="360" rx="12" fill="#151515" stroke="#2E2E2E"/><text x="24" y="34" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="2">EVENT INTELLIGENCE TOPOLOGY</text><g fill="none" stroke="#4A4A4A" stroke-width="2"><path d="M320 92L170 150M320 92L320 150M320 92L470 150M170 194L130 262M170 194L250 262M320 194L320 262M470 194L430 262M470 194L530 262"/></g><g font-family="IBM Plex Mono,monospace" font-size="10" text-anchor="middle"><rect x="250" y="60" width="140" height="64" rx="8" fill="#0B0B0B" stroke="#D1132A" stroke-width="2"/><text x="320" y="88" fill="#D1132A">EVENT</text><text x="320" y="106" fill="#F7F4EC">canonical record</text><rect x="108" y="150" width="124" height="44" rx="8" fill="#0B0B0B" stroke="#F7F4EC"/><text x="170" y="176" fill="#F7F4EC">CLAIMS</text><rect x="258" y="150" width="124" height="44" rx="8" fill="#0B0B0B" stroke="#F7F4EC"/><text x="320" y="176" fill="#F7F4EC">EVIDENCE</text><rect x="408" y="150" width="124" height="44" rx="8" fill="#0B0B0B" stroke="#F7F4EC"/><text x="470" y="176" fill="#F7F4EC">SOURCES</text><rect x="76" y="262" width="108" height="42" rx="8" fill="#0B0B0B" stroke="#A3A3A3"/><text x="130" y="287" fill="#F7F4EC">PLACE</text><rect x="196" y="262" width="108" height="42" rx="8" fill="#0B0B0B" stroke="#A3A3A3"/><text x="250" y="287" fill="#F7F4EC">ARTIFACT</text><rect x="266" y="262" width="108" height="42" rx="8" fill="#0B0B0B" stroke="#A3A3A3"/><text x="320" y="287" fill="#F7F4EC">LIMITATION</text><rect x="376" y="262" width="108" height="42" rx="8" fill="#0B0B0B" stroke="#A3A3A3"/><text x="430" y="287" fill="#F7F4EC">PERSON</text><rect x="488" y="262" width="108" height="42" rx="8" fill="#0B0B0B" stroke