<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Place and material context</title><desc id="desc">An event is anchored to place and material records with provenance and uncertainty kept visible.</desc><rect width="640" height="360" rx="12" fill="#151515" stroke="#2E2E2E"/><text x="24" y="34" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="2">PLACE / MATERIAL CONTEXT</text><g fill="none" stroke="#4A4A4A" stroke-width="2"><path d="M320 102L178 188M320 102L462 188M178 232L320 286M462 232L320 286"/></g><g font-family="IBM Plex Mono,monospace" text-anchor="middle"><circle cx="320" cy="102" r="48" fill="#0B0B0B" stroke="#D1132A" stroke-width="2"/><text x="320" y="98" fill="#D1132A" font-size="10">EVENT</text><text x="320" y="116" fill="#F7F4EC" font-size="9">where / what</text><rect x="106" y="188" width="144" height="44" rx="8" fill="#0B0B0B" stroke="#F7F4EC"/><text x="178" y="214" fill="#F7F4EC" font-size="10">PLACE</text><rect x="390" y="188" width="144" height="44" rx="8" fill="#0B0B0B" stroke="#F7F4EC"/><text x="462" y="214" fill="#F7F4EC" font-size="10">ARTIFACT</text><rect x="246" y="286" width="148" height="44" rx="8" fill="#0B0B0B" stroke="#A3A3A3"/><text x="320" y="312" fill="#F7F4EC" font-size="10">SOURCE PROVENANCE</text></g><g font-family="IBM Plex Mono,monospace" font-size="9" fill="#A3A3A3"><text x="106" y="250">region / site / precision</text><text x="390" y="250">type / repository / date</text><text x="24" y="336">LOCATION AND MATERIAL ASSOCIATION DO NOT BY THEMSELVES ESTABLISH MOTIVE.</text></g></svg>