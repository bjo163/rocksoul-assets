<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Historicity and uncertainty band</title><desc id="desc">Confidence is shown separately from unresolved uncertainty, alternatives and interpretive scope.</desc><rect width="640" height="360" rx="12" fill="#151515" stroke="#2E2E2E"/><text x="24" y="34" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="2">HISTORICITY / UNCERTAINTY BAND</text><text x="24" y="90" fill="#F7F4EC" font-family="Georgia,serif" font-size="28">Confidence is scoped.</text><rect x="24" y="124" width="592" height="28" rx="14" fill="#0B0B0B" stroke="#2E2E2E"/><rect x="25" y="125" width="444" height="26" rx="13" fill="#D1132A"/><text x="24" y="176" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">0%</text><text x="594" y="176" text-anchor="end" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">100%</text><g font-family="IBM Plex Mono,monospace" font-size="10"><rect x="24" y="214" width="176" height="82" rx="8" fill="#0B0B0B" stroke="#F7F4EC"/><text x="40" y="238" fill="#F7F4EC">SUPPORTED SCOPE</text><text x="40" y="263" fill="#A3A3A3">what the score covers</text><text x="40" y="282" fill="#A3A3A3">must stay explicit</text><rect x="232" y="214" width="176" height="82" rx="8" fill="#0B0B0B" stroke="#A3A3A3" stroke-dasharray="4 4"/><text x="248" y="238" fill="#F7F4EC">UNCERTAINTY</text><text x="248" y="263" fill="#A3A3A3">open chronology, motive,</text><text x="248" y="282" fill="#A3A3A3">identity or sequence</text><rect x="440" y="214" width="176" height="82" rx="8" fill="#0B0B0B" stroke="#D1132A"/><text x="456" y="238" fill="#F7F4EC">ALTERNATIVES</text><text x="456" y="263" fill="#A3A3A3">interpretations remain</text><text x="456" y="282" fill="#A3A3A3">visible beside confidence</text></g><text x="24" y="334" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9">CONFIDENCE ≠ UNIVERSAL TRUTH SCORE</text></svg>