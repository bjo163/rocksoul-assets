<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Cross-domain relationship map</title><desc id="desc">Event references to person, story, text, law and perspective remain qualified and do not imply causal origin.</desc><rect width="640" height="360" rx="12" fill="#151515" stroke="#2E2E2E"/><text x="24" y="34" fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="2">CROSS-DOMAIN RELATIONSHIPS</text><g fill="none" stroke="#4A4A4A" stroke-width="2" stroke-dasharray="5 4"><path d="M320 176L110 92M320 176L530 92M320 176L110 274M320 176L530 274"/></g><g font-family="IBM Plex Mono,monospace" text-anchor="middle"><circle cx="320" cy="176" r="58" fill="#0B0B0B" stroke="#D1132A" stroke-width="2"/><text x="320" y="171" fill="#D1132A" font-size="11">EVENT</text><text x="320" y="191" fill="#F7F4EC" font-size="9">local canonical</text><rect x="46" y="68" width="128" height="48" rx="8" fill="#0B0B0B" stroke="#A3A3A3"/><text x="110" y="97" fill="#F7F4EC" font-size="10">PERSON</text><rect x="466" y="68" width="128" height="48" rx="8" fill="#0B0B0B" stroke="#A3A3A3"/><text x="530" y="97" fill="#F7F4EC" font-size="10">STORY / MYTH</text><rect x="46" y="250" width="128" height="48" rx="8" fill="#0B0B0B" stroke="#A3A3A3"/><text x="110" y="279" fill="#F7F4EC" font-size="10">TEXT / LAW</text><rect x="466" y="250" width="128" height="48" rx="8" fill="#0B0B0B" stroke="#A3A3A3"/><text x="530" y="279" fill="#F7F4EC" font-size="10">PERSPECTIVE</text></g><g fill="#A3A3A3" font-family="IBM Plex Mono,monospace" font-size="9"><text x="24" y="326">DASHED EDGE = QUALIFIED REFERENCE · STATUS + CONFIDENCE REQUIRED</text><text x="24" y="342">ASSOCIATION ≠ ORIGIN · CORRELATION ≠ CAUSATION</text></g></svg>